# METAR wind-station registry - coastal wind truth for the verification harness (2026-08-29).
# NOAA aviationweather.gov, public domain, no key. Every airfield reporting a METAR within 25 km
# of a Rosa spot. Regenerated 2026-09-13 at 1947 spots: 208 stations, 886 of 1947 spots have one
# (was 90 / 280 of 624 on 2026-08-29). Discovery reads only airfields reporting AT THAT HOUR, and
# since 2026-09-13 keeps a registered one missing from the snapshot while a spot is in reach (12
# were missing that day) - dropping one would end its archive. GENERATED - regenerate
# with `rosa-pipeline stations --discover metar` after the spot DB changes; hand edits are lost.
# Wind is the ONLY variable read here (speed in kt on the wire, stored as m/s; direction FROM;
# gust when reported). An airport is 5-20 km from the beach, so this measures the model's
# coastal-cell bias, not the beach itself - see rosa_pipeline/stations.py.
