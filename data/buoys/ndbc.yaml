# NDBC buoy registry - validation ground-truth for the accuracy harness (roadmap Stage 0).
# NOAA data is public domain. Each buoy validates the OFFSHORE wave field (Hs / period /
# direction) at its own location; the harness samples the model there and scores it against
# these observations. Seed set of well-known active wave buoys - extend as spots go worldwide.
#
# NOTE: there are NO NDBC stations in the eastern Mediterranean, so this registry gives Israel
# no coverage. Israel's wave truth is ISRAMAR (isramar.ocean.org.il) - all-rights-reserved,
# so it stays LOCAL-VALIDATION-ONLY (never shipped, never committed) plus the surfer 👍👎 loop.
