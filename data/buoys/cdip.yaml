# CDIP-operated Datawell Waverider stations (served via NDBC realtime2, public domain).
# Added 2026-07-23 for the Stage-3b spread arbitration (docs/CALIBRATION.md): Datawell
# hulls measure directional spread (r1) much more cleanly than 3-m discus buoys, so
# comparing their sigma@peak against the discus stations separates "r1 noise" from
# "the parametric spread table is wrong" for >=14 s groundswell. July = Southern
# Hemisphere season: SoCal + Hawaii south-facing stations see real long-period peaks.
