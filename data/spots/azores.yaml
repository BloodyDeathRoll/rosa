# Rosa spot database - the Azores (seeded 2026-10-29). Nine volcanic islands in the middle of
# the North Atlantic, 1,400 km west of Lisbon: black-sand beach breaks and boulder reefs on Sao
# Miguel's north shore (Santa Barbara, Monte Verde, Rabo de Peixe) and south shore (Populo,
# Milicias, Ribeira Quente), the Faja point breaks of Sao Jorge, and scattered reefs on Terceira,
# Faial, Pico, Flores and Santa Maria. Every coast faces open ocean, so offshore direction varies
# per coast. Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Portugal"

defaults: &az
  timezone: Atlantic/Azores
  height_coeff: 1.0
  break_type: beach
  swell_window: [270, 60]
  ideal:
    wind_dir: [135, 225]
    size_m: [0.8, 2.5]

spots:

