# Rosa spot database - Texas (seeded 2026-10-29). The Gulf coast from Bolivar and Galveston's
# seawall piers and jetties through Surfside and Quintana, Matagorda, Port Aransas, Corpus
# Christi's Padre Island and South Padre to Boca Chica: south-east-facing beach, jetties and
# piers on local windswell, winter fronts and tropical-storm swell. Central time.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "USA"

defaults: &tx
  timezone: America/Chicago
  height_coeff: 1.0
  break_type: beach
  swell_window: [70, 200]
  ideal:
    wind_dir: [270, 360]
    size_m: [0.4, 1.8]

spots:

  # ==== SEEDED 2026-10-29 - texas, 24 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 24 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/texas/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
