# Rosa spot database - Saint Martin (seeded 2026-11-12), both sides of the island (Mullet Bay is on the Dutch
# side): E wind swell on the east reefs year-round, N-NW swell Nov-Mar on the west bays.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Saint Martin"

defaults: &sxm
  timezone: America/Marigot
  height_coeff: 1.0
  break_type: beach
  swell_window: [266, 36]
  ideal:
    wind_dir: [106, 196]
    size_m: [0.8, 2.0]

spots:

