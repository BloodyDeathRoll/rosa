  - { id: le-galion, name: "Le Galion", town: "Orient Bay", lat: 18.0753, lon: -63.0141, offshore_direction: 270, swell_window: [25, 155], offshore_km: 5.0, break_type: reef, <<: *sxm }  # sat-verified 2026-11-12 (websearch-seeded)
