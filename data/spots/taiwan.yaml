# Rosa spot database - Taiwan (seeded 2026-10-29). The surf is on three coasts: the north
# (Shalun, Baishawan, Jinshan, Green Bay, Fulong) and Yilan's north-east (Daxi / Honeymoon Bay,
# Double Lions, Wai'ao, Wushi Harbour) on the winter NE monsoon swell; the east (Hualien and
# Taitung: Jici, Baxiandong, Chenggong, Donghe, Jinzun, Dulan) on NE monsoon and typhoon swell;
# the south (Kenting: Jialeshui, Nanwan) on summer SW monsoon and typhoon swell. A few west-coast
# beaches (Chunan, Da'an, Tainan, Kaohsiung) work on the monsoon wind swell. The coasts face every
# direction, so every spot carries its own swell_window, offshore_direction and offshore_km.

country: "Taiwan"

defaults: &tw
  timezone: Asia/Taipei
  height_coeff: 1.0
  break_type: beach
  swell_window: [0, 180]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.8, 2.5]

spots:

