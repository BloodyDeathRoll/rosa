# Rosa spot database - Byron Bay area (seeded 2026-08-31, the first Australian region together
# with sydney). East-facing Tasman/Pacific coast: S-SE groundswell year-round (biggest in
# winter), NE windswell in summer, subtropical water. Offshore wind is from the west.
# Every spot carries offshore_km along its own seaward normal, so the sample point follows
# the pin.

country: "Australia"

defaults: &byr
  timezone: Australia/Sydney
  height_coeff: 1.0
  break_type: beach
  swell_window: [25, 155]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.8, 2.5]

spots:

