# Rosa spot database - San Andres, Colombia (seeded 2026-11-26). The island's south tip and east-coast outer reef: NE trade windswell, winter N swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Colombia"

defaults: &sai
  timezone: America/Bogota
  height_coeff: 1.0
  break_type: reef
  swell_window: [75, 205]
  ideal:
    wind_dir: [275, 5]
    size_m: [0.8, 2.0]

spots:

