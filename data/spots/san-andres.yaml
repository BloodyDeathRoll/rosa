  # judged at z16, re-read by the coordinator on contact sheets; tools/spot-seed/work/c3-osm/).
  # North to south.
  - { id: sound-bay, name: "Sound Bay", town: "San Luis", lat: 12.5220, lon: -81.7086, offshore_direction: 288, swell_window: [43, 173], offshore_km: 5.0, break_type: reef, <<: *sai }  # sat-verified 2026-11-26 (osm-seeded, conf 0.65)
  - { id: punta-sur-san-andres, name: "Punta Sur", town: "San Luis", lat: 12.4802, lon: -81.7274, offshore_direction: 354, swell_window: [109, 239], offshore_km: 5.0, break_type: reef, <<: *sai }  # sat-verified 2026-11-26 (osm-seeded, conf 0.75)
