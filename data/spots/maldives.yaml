# Rosa spot database - Maldives (seeded 2026-08-27). Coral atolls, not a coastline: every
# break is a reef pass or an outer-atoll reef edge, so `break_type` is reef throughout and
# there is no shelf - deep ocean starts a few hundred metres out. Swell is S-SW Southern
# Ocean groundswell (Mar-Oct is the season); the famous North/South Male right-handers face
# E-SE and take it as it wraps the atoll, which is why their windows read S-SE rather than
# SW. Offshore wind on those is the SW monsoon blowing across the atoll from the west, hence
# the regional default below; west-facing spots override it. Every spot carries offshore_km
# along its own seaward normal, so the sample point follows the pin.

defaults: &mv
  timezone: Indian/Maldives
  height_coeff: 1.0
  break_type: reef
  swell_window: [150, 260]
  ideal:
    wind_dir: [220, 340]
    size_m: [0.8, 2.5]

spots:

