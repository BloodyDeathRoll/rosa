# Rosa spot database - Mozambique (seeded 2026-09-03 - East Africa). Ponta do Ouro and Malongane on the South African border, Tofo and Tofinho at Inhambane. S-SE swell, warm water, offshore on the W land breeze.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Mozambique"

defaults: &moz
  timezone: Africa/Maputo
  height_coeff: 1.0
  break_type: beach
  swell_window: [120, 220]
  ideal:
    wind_dir: [250, 20]
    size_m: [0.8, 2.5]

