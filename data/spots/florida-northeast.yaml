# Rosa spot database - Florida Northeast (seeded 2026-10-09). Fernandina and Amelia Island south
# through the Jacksonville beaches and Mayport, Vilano, St Augustine, Matanzas and Flagler to
# Ormond and Daytona: east-facing barrier beach, piers, jetties and inlet sandbars, on NE
# windswell and Aug-Oct hurricane swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "USA"

defaults: &fne
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [0, 150]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.5, 2.0]

spots:

  # ==== SEEDED 2026-10-09 - florida-northeast, 11 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 11 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/florida-northeast/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: fernandina-beach-pier, name: "Fernandina Beach Pier", town: "Fernandina Beach", lat: 30.6691, lon: -81.4296, offshore_direction: 278, swell_window: [33, 163], offshore_km: 5.0, <<: *fne }  # sat-verified 2026-10-09 (websearch-seeded)
  - { id: little-talbot-island, name: "Little Talbot Island", town: "Jacksonville", lat: 30.4546, lon: -81.4099, offshore_direction: 261, swell_window: [16, 146], offshore_km: 5.0, <<: *fne }  # sat-verified 2026-10-09 (websearch-seeded)
