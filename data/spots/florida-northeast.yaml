  - { id: ormond-beach, name: "Ormond Beach", town: "Ormond Beach", lat: 29.2849, lon: -81.0337, offshore_direction: 246, swell_window: [1, 131], offshore_km: 5.0, <<: *fne }  # sat-verified 2026-10-09 (websearch-seeded)
