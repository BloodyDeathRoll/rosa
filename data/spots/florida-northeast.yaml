  - { id: vilano-beach, name: "Vilano Beach", town: "Vilano Beach", lat: 29.9386, lon: -81.2986, offshore_direction: 253, swell_window: [8, 138], offshore_km: 5.0, <<: *fne }  # sat-verified 2026-10-09 (websearch-seeded)
