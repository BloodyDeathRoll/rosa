# Rosa spot database - the Canary Islands (seeded 2026-09-10). Volcanic reefs and points on
# every island, most of them on the north shores facing the NW North Atlantic groundswell;
# the south shores work on the rarer S swells. Offshore direction varies per coast.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &ic
  timezone: Atlantic/Canary
  height_coeff: 1.0
  break_type: reef
  swell_window: [270, 30]
  ideal:
    wind_dir: [90, 200]
    size_m: [0.8, 2.5]

spots:

