  - { id: macarico, name: "Maçarico", town: "Salinópolis", lat: -0.6091, lon: -47.3622, offshore_direction: 225, shore_normal: 20, swell_window: [315, 85], offshore_km: 5.0, break_type: beach, <<: *pa }  # sat-verified 2026-11-12 (osm-seeded)

