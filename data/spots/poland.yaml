# Rosa spot database - Poland (seeded 2026-11-12, gap batch). The Polish Baltic: Hel peninsula, Leba, Kolobrzeg. Short-period N-NW wind swell, autumn-winter storms.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Poland"

defaults: &pl
  timezone: Europe/Warsaw
  height_coeff: 1.0
  break_type: beach
  swell_window: [325, 95]
  ideal:
    wind_dir: [165, 255]
    size_m: [0.5, 1.8]

