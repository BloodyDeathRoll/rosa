# Rosa spot database - Sabah (seeded 2026-11-12). Kota Kinabalu to the Tip of Borneo: NE monsoon swell
# Nov-Mar (Tanjung Aru works on the SW monsoon, May-Sep); small and fickle.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Malaysia"

defaults: &sbh
  timezone: Asia/Kuching
  height_coeff: 1.0
  break_type: beach
  swell_window: [222, 352]
  ideal:
    wind_dir: [62, 152]
    size_m: [0.5, 1.5]

spots:

