# Rosa spot database - New Jersey (seeded 2026-09-03). The Jersey Shore, Sandy Hook to Cape May:
# east-facing barrier beach with groin-held sandbars, best on autumn hurricane swell and winter
# NE windswell; offshore on a W-NW wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &nj
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [35, 165]
  ideal:
    wind_dir: [250, 340]
    size_m: [0.6, 2.5]

spots:

