# Rosa spot database - Rio Grande do Norte (seeded 2026-09-11). Pipa and Natal face E-SE into the trade swell; the north coast faces N. Offshore varies per coast.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

region: Rio Grande do Norte
defaults: &rn
  timezone: America/Fortaleza
  height_coeff: 1.0
  break_type: beach
  swell_window: [0, 160]
  ideal:
    wind_dir: [200, 290]
    size_m: [0.6, 1.8]

