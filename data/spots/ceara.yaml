# Rosa spot database - Ceara (seeded 2026-09-11). A north-facing trade-wind coast (Fortaleza, Paracuru, Taiba, Jericoacoara): N-NE swell Dec-Apr, offshore on a S wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

region: Ceara
country: "Brazil"

defaults: &ce
  timezone: America/Fortaleza
  height_coeff: 1.0
  break_type: beach
  swell_window: [300, 90]
  ideal:
    wind_dir: [135, 225]
    size_m: [0.6, 1.8]

