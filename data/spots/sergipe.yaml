# Rosa spot database - Sergipe (seeded 2026-09-16). Aracaju's long east-facing beaches between Alagoas and Bahia. SE trade swell, offshore on a W wind.
# Every spot carries offshore_km along its own seaward normal, so the deep-water sample follows
# the pin. Defaults are TODO calibrate.

country: "Brazil"

region: Sergipe
defaults: &se
  timezone: America/Maceio
  height_coeff: 1.0
  break_type: beach
  swell_window: [45, 180]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.6, 1.8]

spots:

