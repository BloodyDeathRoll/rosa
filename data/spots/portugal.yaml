# Rosa spot database - Portugal (worldwide expansion, first Atlantic region)
#
# Europe's most consistent coast: NW N-Atlantic groundswell nearly year-round,
# offshore = E-NE land breeze / winter high-pressure easterlies. W-facing spots
# use the loader's default offshore_point (0.06° W = seaward here); the S-facing
# Lisbon/Algarve-south spots override it (a west push would hug the coast).
#
# File order: N→S down the west coast, then E along the Algarve south coast.
#
# CONFIDENCE: coordinates are approximate (well-known-spot knowledge, ~3 dp) and
# tagged "approx - TODO verify"; orientations reasoned from coastal facing, not
# surveyed. Same seed quality as costa-rica.yaml - calibrate before trusting.

country: "Portugal"

defaults: &pt
  timezone: Europe/Lisbon
  height_coeff: 1.0
  break_type: beach
  swell_window: [235, 340]     # WSW → NNW Atlantic
  ideal:
    wind_dir: [45, 135]        # metadata only (scorer uses offshore_direction)
    size_m: [0.8, 2.5]

