# Rosa spot database - Portugal (worldwide expansion, first Atlantic region)
#
# Europe's most consistent coast: NW N-Atlantic groundswell nearly year-round,
# offshore = E-NE land breeze / winter high-pressure easterlies. W-facing spots
# use the loader's default offshore_point (0.06° W = seaward here); the S-facing
# Lisbon/Algarve-south spots override it (a west push would hug the coast).
#
# File order: N→S down the west coast, then E along the Algarve south coast.
#
# CONFIDENCE: coordinates are approximate (well-known-spot knowledge, ~3 dp) and
# tagged "approx - TODO verify"; orientations reasoned from coastal facing, not
# surveyed. Same seed quality as costa-rica.yaml - calibrate before trusting.

defaults: &pt
  timezone: Europe/Lisbon
  height_coeff: 1.0
  break_type: beach
  swell_window: [235, 340]     # WSW → NNW Atlantic
  ideal:
    wind_dir: [45, 135]        # metadata only (scorer uses offshore_direction)
    size_m: [0.8, 2.5]

spots:
  # ---- Norte / Centro ----
  - { id: matosinhos,         name: "Matosinhos (Porto)",       lat: 41.171, lon: -8.692, offshore_direction: 90,  swell_window: [190, 335], <<: *pt }  # sat-verified 2026-07-23 (city beach, sheltered by the harbour mole)
  - { id: espinho,            name: "Espinho",                  lat: 41.008, lon: -8.647, offshore_direction: 85,  swell_window: [200, 345], <<: *pt }  # sat-verified 2026-07-23 (jetty rights)
  - { id: figueira-cabedelo,  name: "Cabedelo (Figueira da Foz)", lat: 40.138, lon: -8.864, offshore_direction: 120, swell_window: [210, 320], <<: *pt }  # sat-verified 2026-08-15 (long sandbar rights S of the Mondego mouth)
  - { id: nazare-norte,       name: "Nazaré (Praia do Norte)",  lat: 39.606, lon: -9.085, offshore_direction: 120, ideal: { wind_dir: [90, 160], size_m: [1.0, 3.0] }, cam: { yt: "_Gi8UC_HPKM", by: "Explore Big Surf, Beaches and Sunsets", by_url: "https://www.youtube.com/@ExploreBigSurfandBeaches" }, swell_window: [210, 0], <<: *pt }  # sat-verified 2026-07-23 (canyon focus; giant in winter - rating tuned for surfable days, not tow days)
  # ---- Peniche ----
  - { id: baleal-lagide,      name: "Lagide (Baleal)",          lat: 39.3775, lon: -9.3418, offshore_direction: 140, swell_window: [265, 50], break_type: reef, <<: *pt }  # sat-verified 2026-08-15
  - { id: supertubos,         name: "Supertubos (Peniche)",     lat: 39.343, lon: -9.362, offshore_direction: 55,  swell_window: [180, 295], offshore_bearing: 233.7, offshore_km: 6.19, <<: *pt }  # sat-verified 2026-07-23 (SW-facing; Europe's heaviest beachbreak)
  # ---- Ericeira (World Surfing Reserve) ----
  - { id: coxos,              name: "Coxos (Ericeira)",         lat: 39.0104, lon: -9.4248, offshore_direction: 120, swell_window: [210, 355], break_type: point, <<: *pt }  # sat-verified 2026-08-15 (Portugal's best right)
  - { id: ribeira-dilhas,     name: "Ribeira d'Ilhas (Ericeira)", lat: 38.9885, lon: -9.4225, offshore_direction: 110, swell_window: [200, 350], break_type: reef, <<: *pt }  # sat-verified 2026-07-23
  # ---- Sintra / Cascais / Lisboa ----
  - { id: praia-grande,       name: "Praia Grande (Sintra)",    lat: 38.817, lon: -9.479, offshore_direction: 95,  swell_window: [215, 5], <<: *pt }  # sat-verified 2026-07-23
  - { id: guincho,            name: "Guincho (Cascais)",        lat: 38.733, lon: -9.474, offshore_direction: 100, swell_window: [210, 335], <<: *pt }  # sat-verified 2026-07-23 (windy - nortada afternoons)
  - { id: carcavelos,         name: "Carcavelos",               lat: 38.678, lon: -9.336, offshore_direction: 10,  swell_window: [130, 280], offshore_bearing: 183.1, offshore_km: 6.46, <<: *pt }  # sat-verified 2026-07-23 (S-facing Tagus-mouth beach; needs W swell wrap)
  - id: costa-caparica
    name: "Costa da Caparica (CDS)"
    lat: 38.635
    lon: -9.2365
    offshore_direction: 80
    swell_window: [170, 285]
    cams:  # Playocean covers the whole strip - three angles on one spot
      - { yt: "qhU5x83fUt8", label: "Panorâmica 2", by: "Playocean", by_url: "https://www.youtube.com/@PlayoceanLive", note: "town-beach panorama" }
      - { yt: "oDbKeeojgyk", label: "Panorâmica 1", by: "Playocean", by_url: "https://www.youtube.com/@PlayoceanLive" }
      - { yt: "TxI7MEJIGWc", label: "Praia do Infante", by: "Playocean", by_url: "https://www.youtube.com/@PlayoceanLive" }
    <<: *pt  # sat-verified 2026-07-23 (jetty peaks)
  # ---- Setúbal / Alentejo ----
