# Rosa spot database - East Java (seeded 2026-09-02, with west-java - Java's south coast in two
# boxes on the Bali recipe). Pacitan's bays in the west, Malang's south coast, Red Island and G-Land at the Blambangan tip.
# SW Indian Ocean groundswell year-round, biggest May-Oct with the SE trade offshore.
# Reef points and river-mouth beaches mixed; break_type, swell_window and offshore_direction
# are per spot.

defaults: &ejv
  timezone: Asia/Jakarta
  height_coeff: 1.0
  break_type: reef
  swell_window: [160, 270]
  ideal:
    wind_dir: [45, 135]
    size_m: [1.0, 3.0]

spots:

  # ==== SEEDED 2026-09-02 - east-java, 12 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 12 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/east-java/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: teleng-ria, name: "Teleng Ria", town: "Pacitan", lat: -8.2220, lon: 111.0786, offshore_direction: 10, swell_window: [125, 255], offshore_km: 5.0, <<: *ejv }  # sat-verified 2026-09-02 (websearch-seeded)
  - { id: pancer-door, name: "Pancer Door", town: "Pacitan", lat: -8.2343, lon: 111.1020, offshore_direction: 40, swell_window: [155, 285], offshore_km: 5.0, <<: *ejv }  # sat-verified 2026-09-02 (websearch-seeded)
  - { id: watu-karung, name: "Watu Karung", town: "Watu Karung", lat: -8.2373, lon: 110.9733, offshore_direction: 12, swell_window: [127, 257], offshore_km: 5.0, <<: *ejv }  # sat-verified 2026-09-02 (websearch-seeded)
  - { id: srau, name: "Srau", town: "Pacitan", lat: -8.2503, lon: 110.9949, offshore_direction: 40, swell_window: [155, 285], offshore_km: 5.0, <<: *ejv }  # sat-verified 2026-09-02 (websearch-seeded)
  - { id: ngliyep, name: "Ngliyep", town: "Ngliyep", lat: -8.3836, lon: 112.4242, offshore_direction: 45, swell_window: [160, 290], offshore_km: 5.0, <<: *ejv }  # sat-verified 2026-09-02 (websearch-seeded)
  - { id: balekambang, name: "Balekambang", town: "Balekambang", lat: -8.4033, lon: 112.5398, offshore_direction: 358, swell_window: [113, 243], offshore_km: 5.0, <<: *ejv }  # sat-verified 2026-09-02 (websearch-seeded)
