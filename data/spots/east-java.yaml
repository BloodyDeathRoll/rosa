  - { id: lampon, name: "Lampon", town: "Pesanggaran", lat: -8.6161, lon: 114.0978, offshore_direction: 6, swell_window: [121, 251], offshore_km: 5.0, <<: *ejv }  # sat-verified 2026-09-02 (websearch-seeded)
  - { id: tiger-tracks, name: "Tiger Tracks", town: "Grajagan", lat: -8.7070, lon: 114.3755, offshore_direction: 60, swell_window: [175, 305], offshore_km: 5.0, <<: *ejv }  # sat-verified 2026-09-02 (websearch-seeded)
  - { id: g-land-kongs, name: "G-Land (Kongs)", town: "Grajagan", lat: -8.7283, lon: 114.3472, offshore_direction: 65, swell_window: [180, 310], offshore_km: 5.0, <<: *ejv }  # sat-verified 2026-09-02 (websearch-seeded)
