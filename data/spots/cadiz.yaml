# Rosa spot database - Cadiz (seeded 2026-09-10). Andalucia's Atlantic coast from Chipiona to
# Tarifa (Huelva's Mazagon and Punta del Moral joined 2026-11-19): SW-facing beaches and reefs (El Palmar, Los Canos) on W-SW swell through the Gulf
# of Cadiz, offshore on the E Levante wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Spain"

defaults: &cad
  timezone: Europe/Madrid
  height_coeff: 1.0
  break_type: beach
  swell_window: [190, 290]
  ideal:
    wind_dir: [30, 120]
    size_m: [0.6, 2.0]

