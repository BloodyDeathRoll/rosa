# Rosa spot database - Rhode Island (seeded 2026-09-03). The south-facing ocean shore from Westerly
# to Newport: New England's most exposed surf, on autumn hurricane swell and winter NE storms;
# offshore on a N-NW wind. Cobble reefs and breachway bars mixed - break_type per spot.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &ri
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [115, 245]
  ideal:
    wind_dir: [315, 45]
    size_m: [0.6, 2.5]

spots:

  # ==== SEEDED 2026-09-03 - rhode-island, 11 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 11 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/rhode-island/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: first-beach, name: "First Beach", town: "Newport", lat: 41.4873, lon: -71.2915, offshore_direction: 335, swell_window: [90, 220], offshore_km: 5.0, <<: *ri }  # sat-verified 2026-09-03 (websearch-seeded)
