# Rosa spot database - Lazio (seeded 2026-11-04). The central Tyrrhenian coast, Santa Marinella
# to Gaeta: Banzai and the Santa Severa reefs, the Fregene and Ostia beaches and Gaeta's coves on
# libeccio (SW) and mistral (W) wind swell, short period, best Oct-Apr; offshore is NE-E.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Italy"

defaults: &laz
  timezone: Europe/Rome
  height_coeff: 1.0
  break_type: beach
  swell_window: [170, 300]
  ideal:
    wind_dir: [20, 110]
    size_m: [0.6, 1.5]

