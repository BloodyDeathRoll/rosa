# Rosa spot database - Grenada (seeded 2026-11-26). The south-west tip: Prickly Point and Cherry Hill, winter N swell and trade windswell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Grenada"

defaults: &gd
  timezone: America/Grenada
  height_coeff: 1.0
  break_type: reef
  swell_window: [170, 300]
  ideal:
    wind_dir: [10, 100]
    size_m: [0.6, 1.8]

spots:

  # ==== SEEDED 2026-11-26 - candidates batch 3, 2 spots (web flow: names from tourism boards,
  # councils, news, prose guides and OSM sport=surfing tags, never competitor listings; pins on named
  # OSM features (© OpenStreetMap contributors, ODbL) or Nominatim / Photon, every pin rendered and
  # judged at z16, re-read by the coordinator on contact sheets; tools/spot-seed/work/c3-caribbean/).
  # North to south.
  - { id: cherry-hill-grenada, name: "Cherry Hill", town: "Cherry Hill", lat: 12.0633, lon: -61.7573, offshore_direction: 90, swell_window: [205, 335], offshore_km: 5.0, break_type: reef, <<: *gd }  # sat-verified 2026-11-26 (osm-seeded, conf 0.65)
  - { id: prickly-point, name: "Prickly Point", town: "Lance Aux Epines", lat: 11.9885, lon: -61.7620, offshore_direction: 20, swell_window: [135, 265], offshore_km: 5.0, break_type: point, <<: *gd }  # sat-verified 2026-11-26 (osm-seeded, conf 0.65)
