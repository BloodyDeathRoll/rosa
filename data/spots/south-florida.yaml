# Rosa spot database - South Florida (seeded 2026-10-07). Miami Beach north through Fort
# Lauderdale, Boca, Delray and the Palm Beaches to Jupiter, Stuart and Jensen Beach: beach,
# pier and inlet breaks, mostly on winter NE windswell and Aug-Oct hurricane swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "USA"

defaults: &sfl
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [0, 130]
  ideal:
    wind_dir: [230, 320]
    size_m: [0.5, 2.0]

spots:

