# Rosa spot database - WA Midwest (seeded 2026-09-03 - closing the WA west-coast gaps). Two Rocks to Dongara: Lancelin, Cervantes, Jurien Bay, Green Head - reef and beach breaks behind an offshore reef chain.
# West-facing Indian Ocean coast: SW groundswell year-round, the SE trade / land breeze offshore
# in the morning and the sea breeze onshore by afternoon. Every spot carries offshore_km along
# its own seaward normal; break_type per spot.
country: "Australia"

region: "WA Midwest"

defaults: &wam
  timezone: Australia/Perth
  height_coeff: 1.0
  break_type: reef
  swell_window: [180, 300]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-09-03 - wa-midwest, 12 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 12 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/wa-midwest/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: home-reef, name: "Home Reef", town: "Port Denison", lat: -29.2699, lon: 114.9217, offshore_direction: 89, swell_window: [204, 334], offshore_km: 5.0, <<: *wam }  # sat-verified 2026-09-03 (websearch-seeded)
