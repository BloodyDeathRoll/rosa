# Rosa spot database - Ghana (seeded 2026-09-03 - West Africa). Busua, Cape Three Points and Dixcove west of Takoradi, Kokrobite and Accra. Year-round S-SW South Atlantic swell, small and consistent; land breeze offshore in the morning.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Ghana"

defaults: &gt
  timezone: Africa/Accra
  height_coeff: 1.0
  break_type: beach
  swell_window: [150, 250]
  ideal:
    wind_dir: [315, 75]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-09-03 - ghana, 3 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 3 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/ghana/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: labadi, name: "Labadi", town: "Accra", lat: 5.5608, lon: -0.1419, offshore_direction: 345, swell_window: [100, 230], offshore_km: 5.0, <<: *gt }  # user-verified 2026-10-08 (was 5.5636,-0.1371)
  - { id: kokrobite, name: "Kokrobite", town: "Kokrobite", lat: 5.4963, lon: -0.3624, offshore_direction: 340, swell_window: [95, 225], offshore_km: 5.0, <<: *gt }  # sat-verified 2026-09-03 (websearch-seeded)
  - { id: busua, name: "Busua", town: "Busua", lat: 4.8080, lon: -1.9340, offshore_direction: 336, swell_window: [91, 221], offshore_km: 5.0, <<: *gt }  # sat-verified 2026-09-03 (websearch-seeded)

