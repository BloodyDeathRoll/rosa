  - { id: senya-beraku, name: "Senya Beraku", town: "Senya Beraku", lat: 5.3865, lon: -0.4885, offshore_direction: 330, swell_window: [85, 215], offshore_km: 5.0, break_type: point, <<: *gt }  # sat-verified 2026-11-12 (websearch-seeded)
  - { id: dixcove, name: "Dixcove (Fort Metal Cross)", town: "Dixcove", lat: 4.7929, lon: -1.9442, offshore_direction: 330, swell_window: [85, 215], offshore_km: 5.0, break_type: reef, <<: *gt }  # sat-verified 2026-11-12 (websearch-seeded)
