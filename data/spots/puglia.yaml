# Rosa spot database - Puglia (seeded 2026-11-04). The Gulf of Taranto (Gandoli, Porto Cesareo) on S-SW swell, the
# Salento Adriatic (Otranto, San Foca, Brindisi, Monopoli, Molfetta) on N-NE bora and E-SE
# scirocco swell, and the Gargano on N bora swell; short-period wind swell, best Oct-Apr.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Italy"

defaults: &pug
  timezone: Europe/Rome
  height_coeff: 1.0
  break_type: beach
  swell_window: [0, 240]
  ideal:
    wind_dir: [180, 300]
    size_m: [0.6, 1.5]

