# Rosa spot database - Chile South (seeded 2026-09-16). Maule Sur (Chanco, Pelluhue, Curanipe), Cobquecura and
# Buchupureo, the Concepcion beaches, Arauco and Lebu, Tirua, the Araucania coast, Valdivia's beaches and the
# Osorno coast. The most exposed Chilean coast - relentless SW Southern Ocean swell, offshore on an E wind.
# Every spot carries offshore_km along its own seaward normal, so the deep-water sample follows
# the pin. Defaults are TODO calibrate.

region: Chile South
country: "Chile"

defaults: &cls
  timezone: America/Santiago
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 310]
  ideal:
    wind_dir: [45, 135]
    size_m: [1.0, 4.0]

spots:

  # ==== SEEDED 2026-09-16 - chile-south, 34 spots. The primary coastline flow found 0 OSM surf
  # beacons on the whole coast (474 named beaches, © OpenStreetMap contributors, ODbL), so every
  # spot here comes from the secondary web-search flow: Chilean/Spanish surf guides -> 48 names ->
  # multi_geocode (Google + Nominatim + Photon) -> ca_xref against the OSM named beaches -> ESRI
  # z16 render, judged one tile at a time, wide z13/z14 reads where the pin missed. 14 names were
  # dropped (sheltered Concepcion-bay and Gulf-of-Arauco water, collapsed geocodes, inland pins);
  # judge log in tools/spot-seed/work/chile-south/judge.json. offshore_direction is the nearest
  # coastline candidate's shore normal, re-aimed where the ray was blocked; swell_window = seaward
