# Rosa spot database - Florida Space Coast (seeded 2026-09-03). Sebastian Inlet north to New Smyrna:
# small, warm and consistent, on hurricane swell Aug-Oct and winter NE windswell. The Bahamas shadow
# most east and south-east swell, so the inlets and their jetty sandbars carry the region.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &fsc
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [20, 150]
  ideal:
    wind_dir: [250, 340]
    size_m: [0.5, 2.0]

spots:

  # ==== SEEDED 2026-09-03 - florida-space-coast, 12 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 12 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/florida-space-coast/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: new-smyrna-inlet, name: "New Smyrna Inlet", town: "New Smyrna Beach", lat: 29.0726, lon: -80.9092, offshore_direction: 233, swell_window: [348, 118], offshore_km: 5.0, <<: *fsc }  # sat-verified 2026-09-03 (websearch-seeded)
