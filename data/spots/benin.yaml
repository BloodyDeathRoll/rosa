# Rosa spot database - Benin (seeded 2026-11-26). Cotonou, Ouidah and the Bouches du Roy: S-SW South Atlantic swell, heavy shorebreak.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Benin"

defaults: &bj
  timezone: Africa/Porto-Novo
  height_coeff: 1.0
  break_type: beach
  swell_window: [100, 230]
