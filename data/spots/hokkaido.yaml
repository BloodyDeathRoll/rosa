# Rosa spot database - Hokkaido. The Pacific coast (Tomakomai, Muroran, Hidaka, Tokachi)
# takes E-SE typhoon and low-pressure swell; the Sea of Japan coast (Otaru, Ishikari)
# runs on the winter NW monsoon wind swell; Hakodate's Tsugaru Strait shore on E-SE.
# Offshore direction varies per coast. Every spot carries offshore_km along its own
# seaward normal.

country: "Japan"

defaults: &hk
  timezone: Asia/Tokyo
  height_coeff: 1.0
  break_type: beach
  ideal:
    wind_dir: [225, 315]       # metadata only (scorer uses offshore_direction)
    size_m: [0.6, 2.0]

spots:

  # ==== SEEDED 2026-09-29 - hokkaido, 18 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 18 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/hokkaido/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
