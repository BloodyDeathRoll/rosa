# Rosa spot database - Vancouver Island, British Columbia (seeded 2026-11-04). The west coast
# (Tofino, Long Beach, Ucluelet) faces the open North Pacific: W-NW groundswell Oct-Apr, cold
# water, sand beaches between rocky points. The Juan de Fuca side (Sombrio, Jordan River,
# Sooke) only works on a big W swell wrapping up the strait.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Canada"

defaults: &vi
  timezone: America/Vancouver
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 320]
  ideal:
    wind_dir: [0, 120]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-11-04 - vancouver-island, 13 spots: web flow, names from surf guides, pins from OSM
  # (© OpenStreetMap contributors, ODbL) / Nominatim and moved onto the break on ESRI z16 tiles
  # (every pin rendered and judged). swell_window = seaward +/-65 deg, TODO calibrate. North to south.
  - { id: mackenzie-beach, name: "MacKenzie Beach", town: "Tofino", lat: 49.1325, lon: -125.9056, offshore_direction: 60, swell_window: [175, 305], offshore_km: 5.0, break_type: beach, <<: *vi }  # sat-verified 2026-11-04 (websearch-seeded)
