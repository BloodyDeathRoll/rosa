# Rosa spot database - WA North (Coral Coast) (seeded 2026-09-02). Geraldton to Gnaraloo: west-facing Indian Ocean coast, SW groundswell, SE trade offshore in the morning.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
country: "Australia"

region: "WA North"

defaults: &wan
  timezone: Australia/Perth
  height_coeff: 1.0
  break_type: reef
  swell_window: [180, 300]
  ideal:
    wind_dir: [45, 135]
    size_m: [1.0, 3.0]

spots:

