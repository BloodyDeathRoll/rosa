# Rosa spot database - Guam (seeded 2026-11-12). Hagatna's Boat Basin and Rick's Reef on the west reef (N-NW winter
# and typhoon swell), Talofofo Bay on the east coast (E trade swell).
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Guam"

defaults: &gu
  timezone: Pacific/Guam
  height_coeff: 1.0
  break_type: reef
  swell_window: [294, 64]
  ideal:
    wind_dir: [134, 224]
    size_m: [0.6, 2.0]

