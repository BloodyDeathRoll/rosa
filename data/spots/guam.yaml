  - { id: boat-basin-hagatna, name: "Boat Basin (Hagåtña)", town: "Hagåtña", lat: 13.4826, lon: 144.7522, offshore_direction: 180, swell_window: [295, 65], offshore_km: 5.0, break_type: reef, <<: *gu }  # sat-verified 2026-11-12 (websearch-seeded)
