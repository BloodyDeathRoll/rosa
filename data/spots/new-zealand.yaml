  # cross-checked - all agreement spread < 4 km). EVERY pin rendered on ESRI imagery
  # at z16 and judged before entering; one candidate (Whakatane Heads) dropped - the
  # geocoder landed on the town CBD/river mouth, not the break. offshore_direction is
  # the nearest primary-flow coastline candidate's shore normal (all < 0.4 km away);
  # swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM place nodes, 4
  # hand overrides in town_overrides.json (Raglan x2, Sumner x2 - the nearest OSM
