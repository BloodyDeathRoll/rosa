  - { id: piha-beach, name: "Piha Beach", town: "Piha", lat: -36.9573, lon: 174.4687, offshore_direction: 86, swell_window: [201, 331], offshore_km: 5.0, <<: *nz }  # sat-verified 2026-09-19 (websearch-seeded)
