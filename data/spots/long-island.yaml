# Rosa spot database - Long Island (seeded 2026-09-03 - the first US east-coast region). New York's
# south-facing Atlantic shore, Rockaway out to Montauk: North Atlantic groundswell in winter and
# hurricane swell Aug-Oct, flat and windswept in between; offshore on a N-NW wind. Sandbars and
# jetties throughout, with Montauk's cobble points the only reef-like breaks.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &li
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [115, 245]
  ideal:
    wind_dir: [330, 50]
    size_m: [0.6, 2.5]

spots:

  # ==== SEEDED 2026-09-03 - long-island, 20 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 20 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/long-island/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: montauk-point, name: "Montauk Point", town: "Montauk", lat: 41.0727, lon: -71.8562, offshore_direction: 205, swell_window: [320, 90], offshore_km: 5.0, <<: *li }  # sat-verified 2026-09-03 (websearch-seeded)
