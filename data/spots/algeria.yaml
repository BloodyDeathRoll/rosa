# Rosa spot database - Algeria (seeded 2026-09-10). A north-facing Mediterranean coast: wind swell
# from the NW-NE storms between Spain and Sardinia, short-period like Israel's, offshore on a S wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &dz
  timezone: Africa/Algiers
  height_coeff: 1.0
  break_type: beach
  swell_window: [270, 60]
  ideal:
    wind_dir: [135, 225]
    size_m: [0.6, 1.5]

spots:

