# Rosa spot database - Falkland Islands (seeded 2026-11-12, gap batch 4). Surf Bay by Stanley and Bertha's Beach: South Atlantic swell, cold water, minefield history (Surf Bay cleared 2020).
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Falkland Islands"

defaults: &fk
  timezone: Atlantic/Stanley
  height_coeff: 1.0
  break_type: beach
  swell_window: [50, 180]
  ideal:
    wind_dir: [250, 340]
    size_m: [0.5, 1.8]

spots:

  # ==== SEEDED 2026-11-12 - gap batch 4, 2 spots (web flow: names from tourism boards, councils,
  # news and prose guides, never competitor listings; pins on named OSM features (© OpenStreetMap
  # contributors, ODbL) or Nominatim / Photon, every pin rendered and judged at z16, re-read by the
  # coordinator on contact sheets; tools/spot-seed/work/gap4-leftovers/). North to south.
  - { id: surf-bay-stanley, name: "Surf Bay", town: "Stanley", lat: -51.6955, lon: -57.7775, offshore_direction: 280, swell_window: [35, 165], offshore_km: 5.0, break_type: beach, <<: *fk }  # sat-verified 2026-11-12 (websearch-seeded, conf 0.6)
  - { id: berthas-beach, name: "Bertha's Beach", town: "Mount Pleasant", lat: -51.8960, lon: -58.3886, offshore_direction: 310, swell_window: [65, 195], offshore_km: 5.0, break_type: beach, <<: *fk }  # sat-verified 2026-11-12 (websearch-seeded, conf 0.6)
