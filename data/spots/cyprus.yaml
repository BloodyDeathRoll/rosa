# Rosa spot database - Cyprus (seeded 2026-09-10). Eastern Mediterranean wind swell: the west
# coast (Paphos) takes W-NW swell, the south coast (Limassol, Larnaca) the S-SW storms.
# Short-period, like Israel's. Offshore direction varies per coast.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &cy
  timezone: Asia/Nicosia
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 300]
  ideal:
    wind_dir: [0, 90]
    size_m: [0.6, 1.5]

spots:

