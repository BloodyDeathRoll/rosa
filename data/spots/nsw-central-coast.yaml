# Rosa spot database - NSW Central Coast (seeded 2026-11-04). Broken Bay's north shore (Pearl Beach,
# Killcare) up through Avoca, Terrigal, The Entrance and Norah Head to the Lake Macquarie coast and
# Newcastle's southern beaches: E-SE-facing beaches and reefs on S-SE groundswell and E swell from
# Tasman lows. Offshore is W. Fills the gap between the Sydney and NSW Mid North Coast boxes.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Australia"
region: "NSW Central Coast"

defaults: &ncc
  timezone: Australia/Sydney
  height_coeff: 1.0
  break_type: beach
  swell_window: [45, 175]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.8, 2.5]

