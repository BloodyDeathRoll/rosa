# Rosa spot database - Karnataka (seeded 2026-10-29). The Arabian Sea coast from Mangaluru (Sasihithlu,
# Mulki, Tannirbhavi) through Udupi (Kapu, Malpe, Maravanthe) to Murudeshwar and Gokarna:
# SW monsoon swell and the pre/post-monsoon groundswell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "India"

defaults: &ka
  timezone: Asia/Kolkata
  height_coeff: 1.0
  break_type: beach
  swell_window: [190, 320]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.6, 2.0]

spots:

  # ==== SEEDED 2026-10-29 - karnataka, 13 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 13 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/karnataka/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: gokarna-main-beach, name: "Gokarna Main Beach", town: "Gokarna", lat: 14.5450, lon: 74.3128, offshore_direction: 79, swell_window: [194, 324], offshore_km: 5.0, <<: *ka }  # sat-verified 2026-10-29 (websearch-seeded)
