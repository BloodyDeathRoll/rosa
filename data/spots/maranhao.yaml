  - { id: olho-dagua-sao-luis, name: "Olho d'Água (São Luís)", town: "São Luís", lat: -2.4780, lon: -44.2275, offshore_direction: 167, swell_window: [282, 52], offshore_km: 5.0, break_type: beach, <<: *ma }  # sat-verified 2026-11-12 (osm-seeded)
