# Rosa spot database - Maranhao (seeded 2026-11-12). Sao Luis's ocean beaches (Olho d'Agua, Sao Marcos) and Travosa
# by the Lencois: N-NE swell on a macrotidal, wind-blown coast; the waves go at low tide.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Brazil"

defaults: &ma
  timezone: America/Fortaleza
  height_coeff: 1.0
  break_type: beach
  swell_window: [296, 66]
  ideal:
    wind_dir: [136, 226]
    size_m: [0.5, 1.8]

