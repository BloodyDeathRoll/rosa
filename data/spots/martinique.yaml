# Rosa spot database - Martinique (seeded 2026-11-12). Tartane and the Atlantic and north coasts: N swell
# Nov-Mar, trade wind swell at Tartane; the south coast needs SE swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

