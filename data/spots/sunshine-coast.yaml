# Rosa spot database - Sunshine Coast (seeded 2026-09-02, with gold-coast - south-east Queensland on
# the Sydney/Byron recipe). East-facing Coral Sea coast: S-SE groundswell in winter, E-NE
# cyclone and trade swell in summer, warm water. Offshore wind is from the W/SW. Sand-bottom
# points and beach breaks; break_type per spot. Every spot carries offshore_km along its own
# seaward normal.

country: "Australia"

defaults: &sc
  timezone: Australia/Brisbane
  height_coeff: 1.0
  break_type: beach
  swell_window: [25, 155]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-09-02 - sunshine-coast, 22 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 22 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/sunshine-coast/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
