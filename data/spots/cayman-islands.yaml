# Rosa spot database - Cayman Islands (seeded 2026-11-26). Grand Cayman's south-east reef at Breakers: Caribbean windswell and winter swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Cayman Islands"

defaults: &ky
  timezone: America/Cayman
  height_coeff: 1.0
  break_type: reef
  swell_window: [105, 235]
  ideal:
    wind_dir: [305, 35]
    size_m: [0.8, 2.0]

spots:

  # ==== SEEDED 2026-11-26 - candidates batch 3, 1 spots (web flow: names from tourism boards,
  # councils, news, prose guides and OSM sport=surfing tags, never competitor listings; pins on named
  # OSM features (© OpenStreetMap contributors, ODbL) or Nominatim / Photon, every pin rendered and
  # judged at z16, re-read by the coordinator on contact sheets; tools/spot-seed/work/c3-caribbean/).
  # North to south.
  - { id: lighthouse-breakers, name: "Lighthouse (Breakers)", town: "Breakers", lat: 19.2938, lon: -81.1991, offshore_direction: 350, swell_window: [105, 235], offshore_km: 5.0, break_type: reef, <<: *ky }  # sat-verified 2026-11-26 (osm-seeded, conf 0.65)
