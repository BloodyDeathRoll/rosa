# Rosa spot database - Scotland West: Scotland's Atlantic side: Kintyre, Islay, Tiree, the Outer Hebrides and the north-west mainland. Open North Atlantic groundswell from the W-NW; offshore on an E wind, cold water.
# Every spot carries offshore_km along its own seaward normal.

defaults: &scw
  timezone: Europe/London
  height_coeff: 1.0
  break_type: beach
  swell_window: [200, 20]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

