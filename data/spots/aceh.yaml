# Rosa spot database - Aceh (seeded 2026-10-29). The west coast of Sumatra's northern tip:
# Lhoknga and Lampuuk west of Banda Aceh, the Pulo Aceh islands (Breueh, Nasi) off the
# tip, Pulau Weh (Sabang), and the reefs south past Lamno and Calang to Meulaboh. Indian
# Ocean groundswell from the SW-W, biggest Apr-Oct; Pantai Camara faces the Andaman side.
# Reef and sand mixed; swell_window and offshore_direction per spot.

country: "Indonesia"

defaults: &ach
  timezone: Asia/Jakarta
  height_coeff: 1.0
  break_type: reef
  swell_window: [180, 300]
  ideal:
    wind_dir: [45, 135]
    size_m: [1.0, 3.0]

spots:

  # ==== SEEDED 2026-10-29 - aceh, 7 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 7 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/aceh/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: lampuuk, name: "Lampuuk", town: "Lampuuk", lat: 5.4934, lon: 95.2286, offshore_direction: 73, swell_window: [188, 318], offshore_km: 5.0, <<: *ach }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: lhoknga, name: "Lhoknga", town: "Lhoknga", lat: 5.4709, lon: 95.2358, offshore_direction: 65, swell_window: [180, 310], offshore_km: 5.0, <<: *ach }  # sat-verified 2026-10-29 (websearch-seeded)  [normal set by hand from the tile, seaward 245]
  - { id: cement-factory, name: "Cement Factory", town: "Lhoknga", lat: 5.4485, lon: 95.2414, offshore_direction: 88, swell_window: [203, 333], offshore_km: 5.0, <<: *ach }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: lamno, name: "Lamno", town: "Lamno", lat: 5.1938, lon: 95.2863, offshore_direction: 43, swell_window: [158, 288], offshore_km: 5.0, <<: *ach }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: left-point, name: "Left Point", town: "Kruengno", lat: 4.9194, lon: 95.3775, offshore_direction: 75, swell_window: [190, 320], offshore_km: 5.0, <<: *ach }  # sat-verified 2026-10-29 (websearch-seeded)  [normal set by hand from the tile, seaward 255]
  - { id: babah-nipah, name: "Babah Nipah", town: "Babahnipah", lat: 4.8194, lon: 95.4173, offshore_direction: 35, swell_window: [150, 280], offshore_km: 5.0, <<: *ach }  # sat-verified 2026-10-29 (websearch-seeded)  [normal set by hand from the tile, seaward 215]
  - { id: kuala-bubon-lefts, name: "Kuala Bubon Lefts", town: "Lhokbubon", lat: 4.1921, lon: 96.0247, offshore_direction: 25, swell_window: [140, 270], offshore_km: 5.0, <<: *ach }  # sat-verified 2026-10-29 (websearch-seeded)  [normal set by hand from the tile, seaward 205]
