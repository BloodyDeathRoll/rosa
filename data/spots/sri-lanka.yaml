# Rosa spot database - Sri Lanka (worldwide expansion)
#
# TWO coasts with opposite exposure AND opposite seasons:
#   * South (&sl_s):  S-facing; S/SW Indian-Ocean groundswell window; offshore wind from the
#                     N/NE. Cleanest Nov-Apr. Sample pushed SOUTH to open water.
#   * East (&sl_e):   E/SE-facing (Arugam Bay cluster); S/SE wrap-around swell; offshore wind
#                     from the W/NW. Season May-Sep. Sample pushed EAST to open water.
#
# offshore_direction = compass bearing the OFFSHORE wind blows FROM (= inland-pointing shore
#   normal = seaward-facing azimuth + 180). Set explicitly per spot.
# offshore_point = deep-water sample point. NOTE: the loader's default pushes 0.06° WEST, which
#   is WRONG for every Sri Lankan spot (none face west) - so EACH carries an explicit
#   offshore_point: south-coast spots pushed south, east-coast spots pushed east.
#
# CONFIDENCE: coordinates approximate (well-known-spot knowledge, ~3-4 dp, tagged "approx -
# TODO verify"); orientations reasoned from coastal facing, not surveyed. Calibration starting
# point, same as the israel.yaml + costa-rica.yaml seeds.

south: &sl_s
  timezone: Asia/Colombo
  swell_window: [150, 230]     # SSE → SW
  height_coeff: 1.0            # calibrate per spot
  break_type: beach
  ideal:
    wind_dir: [0, 90]          # metadata only (scorer uses offshore_direction)
    size_m: [0.6, 2.0]

east: &sl_e
  timezone: Asia/Colombo
  swell_window: [120, 200]     # ESE → SSW wrap
  height_coeff: 1.0
  break_type: point
  ideal:
    wind_dir: [250, 330]
    size_m: [0.6, 2.2]

spots:
