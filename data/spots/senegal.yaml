# Rosa spot database - Senegal (seeded 2026-09-03 - West Africa). Dakar's peninsula points and reefs, the Petite Cote beaches and Cap Skirring. N-NW Atlantic groundswell Oct-Apr; the NE harmattan trade is offshore on the west-facing breaks.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &sen
  timezone: Africa/Dakar
  height_coeff: 1.0
  break_type: reef
  swell_window: [270, 30]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-09-03 - senegal, 8 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 8 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/senegal/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: yoff, name: "Yoff", town: "Yoff", lat: 14.7623, lon: -17.4611, offshore_direction: 173, swell_window: [288, 58], offshore_km: 5.0, <<: *sen }  # sat-verified 2026-09-03 (websearch-seeded)
