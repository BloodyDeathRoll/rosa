# Rosa spot database - Rio de Janeiro (seeded 2026-09-11). South-facing beaches and points from Paraty to Buzios (Prainha, Itauna, Arraial): S-SW groundswell, offshore on a N wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

region: Rio de Janeiro
defaults: &rj
  timezone: America/Sao_Paulo
  height_coeff: 1.0
  break_type: beach
  swell_window: [90, 250]
  ideal:
    wind_dir: [315, 45]
    size_m: [0.8, 2.5]

