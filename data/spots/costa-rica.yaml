# Rosa spot database - Costa Rica (worldwide expansion, first non-Med region)
#
# TWO coasts with opposite exposure, so two default anchors instead of one:
#   * Pacific (&pac):    W/SW-facing; swell window SSW→NW (S groundswell in the
#                        boreal summer + NW winter swell). Morning offshore wind
#                        comes from the E/NE (trades over the cordillera).
#   * Caribbean (&carib): E/NE-facing; swell window N→E (Caribbean trade + winter
#                         N-Atlantic swell). Offshore wind comes from the W/SW.
#
# offshore_direction = compass bearing the OFFSHORE wind blows FROM (= inland-pointing
#   shore normal = seaward-facing azimuth + 180). Set explicitly per spot.
# offshore_point = deep-water sample point. The loader's default pushes 0.06° WEST,
#   which is correct for the open Pacific coast but WRONG for the Caribbean (would sample
#   land) and for the Golfo Dulce spots (Pavones/Matapalo/Punta Banco sit inside a gulf) -
#   those carry offshore_bearing + offshore_km pushing toward real open water.
# swell_window = source-direction arc that reaches the break; override the south-facing
#   and gulf-sheltered spots inline.
#
# CONFIDENCE: coordinates are approximate (well-known-spot knowledge, ~3-4 dp) and tagged
# "approx - TODO verify"; orientations are reasoned from coastal facing, not surveyed -
# treat as a calibration starting point, same as the israel.yaml seed. ideal.size_m bumped
# for the more powerful Pacific coast (calibrate per spot from the log, don't trust blindly).

pacific: &pac
  timezone: America/Costa_Rica
  swell_window: [190, 310]     # SSW → NW
  height_coeff: 1.0            # calibrate per spot
  break_type: beach
  ideal:
    wind_dir: [30, 120]        # metadata only (scorer uses offshore_direction)
    size_m: [0.8, 2.5]

caribbean: &carib
  timezone: America/Costa_Rica
  swell_window: [10, 90]       # N → E
  height_coeff: 1.0
  break_type: reef
  ideal:
    wind_dir: [200, 290]
    size_m: [0.6, 2.0]

spots:
  # ==== PACIFIC ====
  # ---- Guanacaste / North Nicoya (N→S) ----
  - { id: ollies-point,       name: "Ollie's Point",          lat: 10.8521, lon: -85.8001, offshore_direction: 105, shore_normal: 210, offshore_bearing: 210.0, offshore_km: 8.0, break_type: point, swell_window: [160, 290], <<: *pac }  # user-verified 2026-08-15 (Santa Rosa NP, boat access; operator pin on the point's waterline - supersedes the old seaward nudge and two sat passes that could not settle it)
  - { id: witchs-rock,        name: "Witch's Rock (Naranjo)", lat: 10.7951, lon: -85.6810, offshore_direction: 75,  shore_normal: 265, offshore_bearing: 265.0, offshore_km: 7.0,  swell_window: [165, 295], <<: *pac }  # user-verified 2026-08-15 (Santa Rosa NP, boat access; operator pin at the Naranjo rivermouth break, the rock visible offshore SW)
  - { id: playa-grande,       name: "Playa Grande",           lat: 10.3291, lon: -85.8460, offshore_direction: 90,  swell_window: [185, 310], <<: *pac }  # sat-verified 2026-08-15
  - { id: tamarindo,          name: "Tamarindo",              lat: 10.2941, lon: -85.8537, offshore_direction: 70,  swell_window: [165, 340], <<: *pac }  # sat-verified 2026-08-15 (kept)
  - { id: playa-avellanas,    name: "Playa Avellanas",        lat: 10.2293, lon: -85.8381, offshore_direction: 80,  swell_window: [185, 350], <<: *pac }  # sat-verified 2026-08-15
  - { id: playa-negra,        name: "Playa Negra",            lat: 10.1732, lon: -85.8184, offshore_direction: 90,  break_type: reef, swell_window: [180, 270], <<: *pac }  # sat-verified 2026-08-15 (reef)
  - { id: marbella,           name: "Marbella",               lat: 10.0723, lon: -85.7705, offshore_direction: 75,  swell_window: [165, 255], <<: *pac }  # sat-verified 2026-08-04 (old pin was 19 km S and 5 km offshore; Google + Nominatim both place Marbella here)
  - { id: ostional,           name: "Playa Ostional",         lat: 9.9938,  lon: -85.7025, offshore_direction: 70,  swell_window: [165, 295], <<: *pac }  # sat-verified 2026-08-04
  - { id: nosara-guiones,     name: "Nosara (Playa Guiones)", lat: 9.9352, lon: -85.6666, offshore_direction: 70,  cam: { yt: "_W_lH0Pugg4", by: "Vacation Nosara", by_url: "https://www.youtube.com/@VacationNosara" }, swell_window: [160, 330], <<: *pac }  # sat-verified 2026-08-04 (old pin was 2.6 km N off the Nosara rivermouth headland; Guiones is the beach S of it)
  # swell_window derived from the coastline, not the regional default (2026-08-02, `rosa-pipeline
  # horizon`): the sea is open 135-295 deg here, so [190,310] both clipped 30 deg of real ocean
  # to the south - the dominant swell arrives at 189-190 and was losing 28% of its energy on the
  # window edge - and pointed its top 20 deg at dry land. Clipped to shore_normal +-90.
  - { id: santa-teresa,       name: "Santa Teresa",           lat: 9.6424,  lon: -85.1697, offshore_direction: 70,  swell_window: [160, 290], shore_normal: 250, cam: { yt: "Suzc2FnUV1k", by: "malpaisurfcam", by_url: "https://www.youtube.com/@malpaisurfcam1" }, <<: *pac }  # sat-verified 2026-08-15 (kept)
  - { id: mal-pais,           name: "Mal País",               lat: 9.597,  lon: -85.145, offshore_direction: 70,  break_type: reef, swell_window: [200, 340], <<: *pac }  # sat-verified 2026-08-04 (kept - pin already on the rock point, waves breaking on it)
  # ---- Central Pacific (Puntarenas / Jacó) ----
  - { id: boca-barranca,      name: "Boca Barranca",          lat: 9.9602,  lon: -84.7388, offshore_direction: 50,  shore_normal: 270, break_type: point, <<: *pac }  # sat-verified 2026-08-04 (rivermouth long left; head of Gulf of Nicoya - shallow shelf, sample stays gulf-side)
  - { id: jaco,               name: "Jacó",                   lat: 9.6100, lon: -84.6292, offshore_direction: 55,  swell_window: [165, 285], <<: *pac }  # sat-verified 2026-08-04
  - { id: playa-hermosa-jaco, name: "Playa Hermosa (Jacó)",   lat: 9.5715,  lon: -84.6042, offshore_direction: 55,  swell_window: [145, 300], <<: *pac }  # sat-verified 2026-08-15 (kept) (powerful beachbreak)
  - { id: esterillos,         name: "Esterillos",             lat: 9.5211,  lon: -84.5175, offshore_direction: 50,  swell_window: [140, 270], <<: *pac }  # sat-verified 2026-08-04 (west end of the Esterillos strip - Oeste/Centro/Este span ~7 km, kept the original longitude)
  - { id: playa-bejuco,       name: "Playa Bejuco",           lat: 9.5163, lon: -84.4329, offshore_direction: 50,  swell_window: [140, 230], <<: *pac }  # sat-verified 2026-08-15
  - { id: manuel-antonio,     name: "Manuel Antonio (Playitas)", lat: 9.3962, lon: -84.1624, offshore_direction: 35, swell_window: [145, 290], <<: *pac }  # sat-verified 2026-08-04 (more S-facing; Google names this exact beach "Playa Playitas (Manuel Antonio)")
  # ---- South Pacific (Dominical / Osa / Golfo Dulce) ----
  - { id: dominical,          name: "Dominical",              lat: 9.2471, lon: -83.8609, offshore_direction: 40,  swell_window: [135, 305], <<: *pac }  # sat-verified 2026-08-04
  - { id: matapalo-osa,       name: "Matapalo (Cabo Matapalo)", lat: 8.3785, lon: -83.2882, offshore_direction: 330, swell_window: [133, 280], offshore_bearing: 223.4, offshore_km: 10.72, break_type: point, shore_normal: 210, <<: *pac }  # sat-verified 2026-08-04 (SE tip of Osa; sample pushed SW to open Pacific)
  - { id: pavones,            name: "Pavones",                lat: 8.3945, lon: -83.1395, offshore_direction: 70,  swell_window: [175, 220], offshore_bearing: 206.7, offshore_km: 14.43, break_type: point, shore_normal: 206.7, <<: *pac }  # sat-verified 2026-08-15 (world-class long left inside Golfo Dulce; sample pushed to gulf mouth)
  - { id: punta-banco,        name: "Punta Banco",            lat: 8.353,  lon: -83.142, offshore_direction: 55,  swell_window: [145, 325], offshore_bearing: 214.7, offshore_km: 11.22, break_type: reef, <<: *pac }  # sat-verified 2026-08-15 (kept) (just S of Pavones)
  # ==== CARIBBEAN (E/NE-facing; offshore ray cast EAST into the sea) ====
  - { id: playa-bonita,       name: "Playa Bonita (Limón)",   lat: 10.0119, lon: -83.0461, offshore_direction: 225, offshore_bearing: 82.9, offshore_km: 7.29, break_type: beach, shore_normal: 82.9, swell_window: [353, 115], <<: *carib }  # sat-verified 2026-08-15 (kept)
  - { id: isla-uvita,         name: "Isla Uvita (Limón)",     lat: 9.9946, lon: -83.0107, offshore_direction: 240, offshore_bearing: 91.7, offshore_km: 7.67, shore_normal: 91.7, swell_window: [2, 140], <<: *carib }  # sat-verified 2026-08-04 (island reef, boat access; pin on the island's exposed N shore)
  - { id: salsa-brava,        name: "Salsa Brava (Puerto Viejo)", lat: 9.6598, lon: -82.7447, offshore_direction: 235, offshore_bearing: 91.8, offshore_km: 5.96, shore_normal: 91.8, swell_window: [2, 105], <<: *carib }  # sat-verified 2026-08-15 (heavy shallow reef)
  - { id: playa-cocles,       name: "Playa Cocles",           lat: 9.6454, lon: -82.7237, offshore_direction: 240, offshore_bearing: 99.4, offshore_km: 5.97, break_type: beach, shore_normal: 99.4, <<: *carib }  # sat-verified 2026-08-15
