# Rosa spot database — Costa Rica (worldwide expansion, first non-Med region)
#
# TWO coasts with opposite exposure, so two default anchors instead of one:
#   * Pacific (&pac):    W/SW-facing; swell window SSW→NW (S groundswell in the
#                        boreal summer + NW winter swell). Morning offshore wind
#                        comes from the E/NE (trades over the cordillera).
#   * Caribbean (&carib): E/NE-facing; swell window N→E (Caribbean trade + winter
#                         N-Atlantic swell). Offshore wind comes from the W/SW.
#
# offshore_direction = compass bearing the OFFSHORE wind blows FROM (= inland-pointing
#   shore normal = seaward-facing azimuth + 180). Set explicitly per spot.
# offshore_point = deep-water sample point. The loader's default pushes 0.06° WEST,
#   which is correct for the open Pacific coast but WRONG for the Caribbean (would sample
#   land) and for the Golfo Dulce spots (Pavones/Matapalo/Punta Banco sit inside a gulf) —
#   those carry an explicit offshore_point pushing toward real open water.
# swell_window = source-direction arc that reaches the break; override the south-facing
#   and gulf-sheltered spots inline.
#
# CONFIDENCE: coordinates are approximate (well-known-spot knowledge, ~3-4 dp) and tagged
# "approx — TODO verify"; orientations are reasoned from coastal facing, not surveyed —
# treat as a calibration starting point, same as the israel.yaml seed. ideal.size_m bumped
# for the more powerful Pacific coast (calibrate per spot from the log, don't trust blindly).

pacific: &pac
  timezone: America/Costa_Rica
  swell_window: [190, 310]     # SSW → NW
  height_coeff: 1.0            # calibrate per spot
  break_type: beach
  ideal:
    wind_dir: [30, 120]        # metadata only (scorer uses offshore_direction)
    size_m: [0.8, 2.5]

caribbean: &carib
  timezone: America/Costa_Rica
  swell_window: [10, 90]       # N → E
  height_coeff: 1.0
  break_type: reef
  ideal:
    wind_dir: [200, 290]
    size_m: [0.6, 2.0]

