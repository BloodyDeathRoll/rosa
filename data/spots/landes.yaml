# Rosa spot database - Landes & Basque coast (seeded 2026-09-03). Biscay's west-facing beach breaks (Hossegor, Seignosse, Capbreton) and the Basque reefs (Guethary, Anglet): W-NW groundswell, offshore on an E wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "France"

defaults: &lan
  timezone: Europe/Paris
  height_coeff: 1.0
  break_type: beach
  swell_window: [230, 330]
  ideal:
    wind_dir: [50, 150]
    size_m: [0.8, 2.5]

spots:

