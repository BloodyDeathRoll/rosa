# Rosa spot database - Outer Banks (seeded 2026-09-03). North Carolina's barrier islands, Corolla
# through Cape Hatteras to Ocracoke plus the Cape Fear beaches: the most swell-exposed stretch of
# the US east coast, with Hatteras sitting far enough offshore to catch swell the mainland misses.
# Peak season is hurricane swell Aug-Oct; offshore on a W-SW wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &obx
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [25, 155]
  ideal:
    wind_dir: [250, 340]
    size_m: [0.8, 3.0]

spots:

  # ==== SEEDED 2026-09-03 - outer-banks, 16 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 16 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/outer-banks/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: corolla, name: "Corolla", town: "Corolla", lat: 36.3815, lon: -75.8241, offshore_direction: 258, swell_window: [13, 143], offshore_km: 5.0, <<: *obx }  # sat-verified 2026-09-03 (websearch-seeded)
