# Rosa spot database - Bali (seeded 2026-09-02, the first Indonesian region). Two coasts in
# one box: the Bukit and west coast face SW into Indian Ocean groundswell and are offshore
# on the dry-season SE trade (May-Oct); the east coast (Keramas, Sanur, Nusa Dua) and Nusa
# Lembongan face E-SE, work in the wet-season W wind, and take the same S swell wrapping in.
# swell_window and offshore_direction are per spot; the anchor's default is the west coast.
# Reef throughout except the Kuta-Canggu and Medewi beaches, set per spot.

defaults: &bali
  timezone: Asia/Makassar
  height_coeff: 1.0
  break_type: reef
  swell_window: [180, 290]
  ideal:
    wind_dir: [60, 150]
    size_m: [1.0, 3.0]

spots:

