# Rosa spot database - Bangladesh (seeded 2026-11-12, gap batch). Laboni Point, Cox's Bazar: Bay of Bengal beach break, SW monsoon swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Bangladesh"

defaults: &bd
  timezone: Asia/Dhaka
  height_coeff: 1.0
  break_type: beach
  swell_window: [170, 300]
  ideal:
    wind_dir: [10, 100]
    size_m: [0.5, 1.8]

spots:

  # ==== SEEDED 2026-11-12 - gap batch, 1 spots (web flow: names from tourism boards, councils,
  # news and prose guides, never competitor listings; pins on named OSM features (© OpenStreetMap
  # contributors, ODbL) or Nominatim / Photon, every pin rendered and judged at z16, re-read by the
  # coordinator on contact sheets; tools/spot-seed/work/gap-indian/). North to south.
  - { id: laboni-point, name: "Laboni Point", town: "Cox's Bazar", lat: 21.4276, lon: 91.9701, offshore_direction: 55, swell_window: [170, 300], offshore_km: 5.0, break_type: beach, <<: *bd }  # sat-verified 2026-11-12 (websearch-seeded, conf 0.75)
