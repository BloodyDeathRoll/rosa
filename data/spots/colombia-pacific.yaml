# Rosa spot database - Colombia Pacific (seeded 2026-10-09). Choco and Valle del Cauca: Bahia Solano and El Valle, Nuqui and Termales,
# Pico de Loro, Ladrilleros, Tumaco. S-SW groundswell Apr-Oct, NW swell Dec-Mar, warm water, heavy rain.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

region: Colombia Pacific
defaults: &cp
  timezone: America/Bogota
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 310]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-10-09 - colombia-pacific, 11 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 11 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/colombia-pacific/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: mecana, name: "Mecana", town: "Mecana", lat: 6.2674, lon: -77.3890, offshore_direction: 129, swell_window: [244, 14], offshore_km: 5.0, <<: *cp }  # sat-verified 2026-10-09 (websearch-seeded)
