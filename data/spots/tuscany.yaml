# Rosa spot database - Tuscany (seeded 2026-11-04). The Tyrrhenian's north-east shore, Forte dei
# Marmi to Ansedonia plus Elba: Versilia beaches and the Livorno reefs on libeccio (SW) and
# mistral (W-NW) wind swell, short period, best Oct-Apr; offshore is E-NE.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

