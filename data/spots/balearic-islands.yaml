# Rosa spot database - Balearic Islands. Mallorca, Menorca, Ibiza and Formentera: every
# coast faces a different sea - the north shores (Son Serra, Cala Mesquida, Menorca's
# Cavalleria) take the Gulf of Lion's mistral swell from the N-NE, the south and west
# (Es Trenc, Cala Major, Son Bou, Formentera's Migjorn) the SW-S. Short-period wind
# swell. Offshore direction varies per coast. Every spot carries offshore_km along its
# own seaward normal; break_type per spot.

country: "Spain"

defaults: &bal
  timezone: Europe/Madrid
  height_coeff: 1.0
  break_type: beach
  swell_window: [0, 360]
  ideal:
    wind_dir: [135, 225]
    size_m: [0.5, 1.5]

spots:

  # ==== SEEDED 2026-10-29 - balearic-islands, 18 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 18 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/balearic-islands/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
