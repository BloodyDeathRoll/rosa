# Rosa spot database - Brunei (seeded 2026-11-12). NE monsoon wind swell off the South China Sea,
# Nov-Mar; low, unreliable beach breaks.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Brunei"

defaults: &bn
  timezone: Asia/Brunei
  height_coeff: 1.0
  break_type: beach
  swell_window: [280, 50]
  ideal:
    wind_dir: [120, 210]
    size_m: [0.5, 1.2]

spots:

  # ==== SEEDED 2026-11-12 - brunei, 1 spots (web-search flow; coordinates from OSM /
