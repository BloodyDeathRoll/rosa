# Rosa spot database - Nicaragua (worldwide expansion)
#
# Pacific SW-facing coast only (the Caribbean side has no established spots).
# Same swell regime as Costa Rica's Pacific (S-SW groundswell, boreal-summer
# peak) with one famous difference: Lake Nicaragua drives near-permanent E-NE
# OFFSHORE wind on the SW coast ("300 offshore days a year") - expect the wind
# score to sit high; that is real, not a bug.
# The loader's default offshore_point (0.06° W) is seaward everywhere on this
# coast; only the more S-facing river-mouth at Puerto Sandino overrides it.
#
# CONFIDENCE: coordinates are approximate (well-known-spot knowledge, ~3 dp) and
# tagged "approx - TODO verify"; orientations reasoned from coastal facing, not
# surveyed. Same seed quality as costa-rica.yaml - calibrate before trusting.

defaults: &nic
  timezone: America/Managua
  height_coeff: 1.0
  break_type: beach
  swell_window: [170, 290]     # S → WNW Pacific
  ideal:
    wind_dir: [30, 120]        # metadata only (scorer uses offshore_direction)
    size_m: [0.8, 2.5]

spots:
  # ---- Northwest (Chinandega) ----
  - { id: the-boom,           name: "The Boom (Aposentillo)", town: "Aposentillo",   lat: 12.6322, lon: -87.3634, offshore_direction: 60,  swell_window: [150, 315], <<: *nic }  # sat-verified 2026-07-23 (hollow beachbreak)
  # ---- León / Managua coast ----
  - { id: puerto-sandino,     name: "Puerto Sandino", town: "Puerto Sandino",           lat: 12.193, lon: -86.774, offshore_direction: 40,  swell_window: [165, 295], offshore_bearing: 233.2, offshore_km: 11.68, break_type: point, <<: *nic }  # sat-verified 2026-07-23 (long river-mouth left, tide-fussy)
  - { id: miramar,            name: "Miramar", town: "El Velero",                  lat: 12.1448, lon: -86.7519, offshore_direction: 70,  break_type: reef, swell_window: [195, 300], <<: *nic }  # sat-verified 2026-08-15
  - { id: el-transito,        name: "El Tránsito", town: "Tecolote",              lat: 12.0235, lon: -86.695, offshore_direction: 55,  swell_window: [155, 315], <<: *nic }  # sat-verified 2026-07-23
  # ---- Rivas / Popoyo zone ----
  - { id: el-astillero,       name: "El Astillero", town: "El Astillero",             lat: 11.5125, lon: -86.168, offshore_direction: 50,  swell_window: [180, 320], <<: *nic }  # sat-verified 2026-07-23
  - { id: popoyo,             name: "Popoyo", town: "Popoyo",                   lat: 11.452, lon: -86.102, offshore_direction: 50,  break_type: reef, swell_window: [150, 305], <<: *nic }  # sat-verified 2026-07-23 (main reef; outer reef holds XL)
  - { id: playa-santana,      name: "Playa Santana", town: "Jiquelite",            lat: 11.4445, lon: -86.0905, offshore_direction: 55,  swell_window: [170, 295], <<: *nic }  # sat-verified 2026-08-15 (kept)
  - { id: panga-drops,        name: "Panga Drops", town: "El Limón",              lat: 11.4315, lon: -86.077, offshore_direction: 60,  break_type: reef, <<: *nic }  # sat-verified 2026-07-23 (wide-open A-frame on volcanic reef)
  - { id: playa-colorado,     name: "Playa Colorado", town: "El Gigante",           lat: 11.411, lon: -86.061, offshore_direction: 55,  swell_window: [145, 270], <<: *nic }  # sat-verified 2026-07-23 (Nicaragua's barrel magnet)
  - { id: playa-gigante,      name: "Playa Gigante", town: "El Gigante",            lat: 11.39, lon: -86.0329, offshore_direction: 60,  swell_window: [195, 320], <<: *nic }  # sat-verified 2026-08-15
  # ---- San Juan del Sur zone ----
  - { id: playa-maderas,      name: "Playa Maderas", town: "San Lorenzo",            lat: 11.3061, lon: -85.9245, offshore_direction: 80,  swell_window: [170, 280], <<: *nic }  # sat-verified 2026-08-15 (SJDS's everyday peak)
  - { id: playa-remanso,      name: "Playa Remanso", town: "Playa Remanso",            lat: 11.2212, lon: -85.8485, offshore_direction: 60,  swell_window: [185, 290], <<: *nic }  # sat-verified 2026-08-15 (beginner-friendly)
  - { id: playa-hermosa-sjds, name: "Playa Hermosa (SJDS)", town: "Escamequita",     lat: 11.2025, lon: -85.836, offshore_direction: 50,  swell_window: [165, 310], <<: *nic }  # sat-verified 2026-07-23
  - { id: playa-yankee,       name: "Playa Yankee", town: "El Coco",             lat: 11.179, lon: -85.818, offshore_direction: 55,  swell_window: [160, 295], <<: *nic }  # sat-verified 2026-07-23 (punchy, uncrowded)

  # ==== WEB-SEARCH-SEEDED (2026-07-24) - surf-guide discovery, Google/Nominatim/Photon
  # geocode cross-checked + ESRI sat-verified. Locations verified; params TODO-tune. ====
  - { id: manzanillo, name: "Manzanillo (Tola)", town: "Guacalito de la Isla", lat: 11.3705, lon: -86.0093, offshore_direction: 50, offshore_bearing: 230.0, offshore_km: 5.0, <<: *nic }  # websearch-seeded 2026-07-24 (geocoded+sat-verified) - TODO verify
