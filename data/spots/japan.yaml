# Rosa spot database - Japan (worldwide expansion)
#
# Pacific-facing coasts only for v1 (Sea of Japan winter windswell coast deferred).
# Swell regime: typhoon S-SE groundswell (Aug-Oct peak) + year-round NE-E windswell
# (Chiba/Tohoku) + winter W monsoon is OFFSHORE on most of these coasts - Japan's
# Pacific side is a morning-offshore coast like Israel, not a storm coast.
#
# ⚠ offshore_point: the loader default pushes 0.06° WEST - that is INLAND for this
# east-facing coast, so EVERY spot here carries an explicit offshore_point pushed
# seaward along its shore normal.
#
# CONFIDENCE: coordinates are approximate (well-known-spot knowledge, ~3 dp) and
# tagged "approx - TODO verify"; orientations reasoned from coastal facing, not
# surveyed. Same seed quality as costa-rica.yaml - calibrate before trusting.

defaults: &jp
  timezone: Asia/Tokyo
  height_coeff: 1.0
  break_type: beach
  ideal:
    wind_dir: [225, 315]       # metadata only (scorer uses offshore_direction)
    size_m: [0.6, 2.0]

spots:
  # ---- Tohoku (Miyagi) ----
  - { id: sendai-shinko,      name: "Sendai Shinko",            lat: 38.2605, lon: 141.0215, offshore_direction: 265, swell_window: [30, 160],  offshore_point: [38.26, 141.09], <<: *jp }  # sat-verified 2026-07-23 (consistent E-facing jetty beach)
  # ---- Chiba (E-facing, most consistent Honshu coast) ----
  - { id: tsurigasaki,        name: "Tsurigasaki (Ichinomiya)", lat: 35.373, lon: 140.394, offshore_direction: 270, swell_window: [40, 170],  offshore_point: [35.375, 140.46], <<: *jp }  # sat-verified 2026-07-23 (2020 Olympic venue)
  - { id: onjuku,             name: "Onjuku",                   lat: 35.1845, lon: 140.3525, offshore_direction: 340, swell_window: [90, 200],  offshore_point: [35.13, 140.37], <<: *jp }  # approx - TODO verify (S-facing bay)
  - { id: hebara,             name: "Hebara",                   lat: 35.1615, lon: 140.3345, offshore_direction: 315, swell_window: [70, 190],  offshore_point: [35.12, 140.38], <<: *jp }  # sat-verified 2026-07-23 (Chiba's barrel beach)
  - { id: kamogawa-malibu,    name: "Kamogawa (Malibu)",        lat: 35.0985, lon: 140.1045, offshore_direction: 330, swell_window: [90, 200],  offshore_point: [35.05, 140.14], break_type: point, <<: *jp }  # approx - TODO verify (longboard point off river mouth)
  # ---- Shonan / Sagami Bay (S-facing; needs S-SE typhoon or solid low) ----
  - { id: chigasaki,          name: "Chigasaki",                lat: 35.318, lon: 139.404, offshore_direction: 0,   swell_window: [130, 210], offshore_point: [35.26, 139.40], <<: *jp }  # approx - TODO verify (Southern Beach)
  - { id: kugenuma,           name: "Kugenuma (Enoshima)",      lat: 35.3145, lon: 139.47, offshore_direction: 5,   swell_window: [130, 210], offshore_point: [35.25, 139.45], ideal: { wind_dir: [315, 45], size_m: [0.5, 1.5] }, <<: *jp }  # sat-verified 2026-07-23 (Japan's most crowded beginner beach)
  - { id: shichirigahama,     name: "Shichirigahama (Kamakura)", lat: 35.3055, lon: 139.512, offshore_direction: 20,  swell_window: [140, 215], offshore_point: [35.25, 139.49], <<: *jp }  # approx - TODO verify
  # ---- Izu / Shizuoka ----
  - { id: shirahama-izu,      name: "Shirahama (Izu)",          lat: 34.6905, lon: 138.9735, offshore_direction: 295, swell_window: [60, 180],  offshore_point: [34.68, 139.03], <<: *jp }  # approx - TODO verify (white-sand E-facing beach, Shimoda)
