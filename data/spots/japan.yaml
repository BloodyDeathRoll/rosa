# Rosa spot database - Japan (worldwide expansion)
#
# Pacific-facing coasts only for v1 (Sea of Japan winter windswell coast deferred).
# Swell regime: typhoon S-SE groundswell (Aug-Oct peak) + year-round NE-E windswell
# (Chiba/Tohoku) + winter W monsoon is OFFSHORE on most of these coasts - Japan's
# Pacific side is a morning-offshore coast like Israel, not a storm coast.
#
# ⚠ offshore_point: the loader default pushes 0.06° WEST - that is INLAND for this
# east-facing coast, so EVERY spot here carries offshore_bearing + offshore_km pushed
# seaward along its shore normal.
#
# CONFIDENCE: coordinates are approximate (well-known-spot knowledge, ~3 dp) and
# tagged "approx - TODO verify"; orientations reasoned from coastal facing, not
# surveyed. Same seed quality as costa-rica.yaml - calibrate before trusting.

defaults: &jp
  timezone: Asia/Tokyo
  height_coeff: 1.0
  break_type: beach
  ideal:
    wind_dir: [225, 315]       # metadata only (scorer uses offshore_direction)
    size_m: [0.6, 2.0]

