# Rosa spot database - Faroe Islands (seeded 2026-10-29). Steep fjord-cut islands in the open
# North Atlantic: the few sand bays that break face north (Tjornuvik), south-west (Famjin,
# Sandavagur) or east (Sandoy). Most of the coast is cliff and deep fjord that never breaks.
# Cold water, short days in winter. Every spot carries offshore_km along its own seaward normal;
# break_type per spot.

country: "Faroe Islands"

defaults: &fo
  timezone: Atlantic/Faroe
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 340]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-10-29 - faroe-islands, 6 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 6 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/faroe-islands/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: tjornuvik, name: "Tjornuvik", town: "Tjørnuvík", lat: 62.2903, lon: -7.1470, offshore_direction: 204, swell_window: [319, 89], offshore_km: 5.0, <<: *fo }  # sat-verified 2026-10-29 (websearch-seeded); normal re-aimed to seaward 24, the bay axis (GEBCO reads land to 0.5 km on every bearing in this narrow bay)
  - { id: sandavagur, name: "Sandavagur", town: "Sandavágur", lat: 62.0538, lon: -7.1534, offshore_direction: 0, swell_window: [115, 245], offshore_km: 5.0, <<: *fo }  # sat-verified 2026-10-29 (websearch-seeded); normal re-aimed to seaward 180, down the fjord (the coastline normal 110 crossed Vagar)
  - { id: husavik, name: "Husavik", town: "Húsavík", lat: 61.8089, lon: -6.6743, offshore_direction: 280, swell_window: [35, 165], offshore_km: 5.0, <<: *fo }  # sat-verified 2026-10-29 (websearch-seeded); normal re-aimed to seaward 100, the middle of the open E arc (70-120)
  - { id: dalur, name: "Dalur", town: "Dalur", lat: 61.7840, lon: -6.6737, offshore_direction: 290, swell_window: [45, 175], offshore_km: 5.0, <<: *fo }  # sat-verified 2026-10-29 (websearch-seeded); normal re-aimed to seaward 110, the middle of the open E arc (100-120)
  - { id: famjin-right, name: "Famjin Right", town: "Fámjin", lat: 61.5271, lon: -6.8885, offshore_direction: 90, swell_window: [205, 335], offshore_km: 5.0, <<: *fo }  # sat-verified 2026-10-29 (websearch-seeded); normal re-aimed to seaward 270, out of the W-facing bay (the coastline normal 27 crossed Suduroy)
  - { id: famjin-left, name: "Famjin Left", town: "Fámjin", lat: 61.5237, lon: -6.8973, offshore_direction: 90, swell_window: [205, 335], offshore_km: 5.0, <<: *fo }  # sat-verified 2026-10-29 (websearch-seeded); normal re-aimed to seaward 270, out of the W-facing bay (the coastline normal 331 crossed the north headland)
