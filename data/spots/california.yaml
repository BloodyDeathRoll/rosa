# Rosa spot database - California (seeded via cam-scan discovery 2026-07-27)
# Two LA-area spots added because live cams exist for them (docs/cam-scan-plan.md
# §3: a camera pointed at a break we don't track = a missed spot). Coordinates
# google-geocoded; orientations reasoned from coastal facing - TODO sat-verify.
# Swell regime: NW winter groundswell + S-SSW summer swell; Santa Monica Bay is
# shadowed from due W-NW by Point Dume - windows reflect the bay geometry.

country: "USA"

defaults: &ca
  timezone: America/Los_Angeles
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 290]
  ideal:
    wind_dir: [30, 120]
    size_m: [0.6, 2.0]

spots:
