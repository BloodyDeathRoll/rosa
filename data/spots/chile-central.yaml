# Rosa spot database - Chile Central (seeded 2026-09-16). Coquimbo and La Serena through Valparaiso and Pichilemu (Punta de Lobos) to Constitucion. Big S-SW groundswell, cold Humboldt water, offshore on an E wind.
# Every spot carries offshore_km along its own seaward normal, so the deep-water sample follows
# the pin. Defaults are TODO calibrate.

region: Chile Central
defaults: &clc
  timezone: America/Santiago
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 310]
  ideal:
    wind_dir: [45, 135]
    size_m: [1.0, 3.5]

