# Rosa spot database - Odisha (seeded 2026-10-29). Puri and the Konark coast (Ramchandi, Chandrabhaga),
# home of the India Surf Festival: S-SE Bay of Bengal swell, offshore in the NW winter wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "India"

defaults: &od
  timezone: Asia/Kolkata
  height_coeff: 1.0
  break_type: beach
  swell_window: [90, 220]
  ideal:
    wind_dir: [270, 360]
    size_m: [0.6, 2.0]

spots:

  # ==== SEEDED 2026-10-29 - odisha, 3 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 3 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/odisha/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: chandrabhaga, name: "Chandrabhaga", town: "Konark", lat: 19.8654, lon: 86.1123, offshore_direction: 343, swell_window: [98, 228], offshore_km: 5.0, <<: *od }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: ramchandi, name: "Ramchandi", town: "Konark", lat: 19.8438, lon: 86.0280, offshore_direction: 349, swell_window: [104, 234], offshore_km: 5.0, <<: *od }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: puri, name: "Puri", town: "Puri", lat: 19.7970, lon: 85.8355, offshore_direction: 343, swell_window: [98, 228], offshore_km: 5.0, <<: *od }  # sat-verified 2026-10-29 (websearch-seeded)
