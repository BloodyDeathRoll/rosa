  - { id: liwliwa,            name: "Liwliwa (San Felipe)", town: "San Felipe",     lat: 15.0614, lon: 120.0606, offshore_direction: 85,  swell_window: [185, 340], <<: *phw }  # sat-verified 2026-07-23 (Zambales)
  - { id: crystal-beach,      name: "Crystal Beach (San Narciso)", town: "La Paz", lat: 15.0215, lon: 120.063, offshore_direction: 80,  swell_window: [190, 340], <<: *phw }  # sat-verified 2026-07-23
  # ---- Luzon Pacific coast ----
