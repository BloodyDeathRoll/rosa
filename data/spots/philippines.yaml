# Rosa spot database - Philippines (worldwide expansion)
#
# TWO exposures, opposite seasons:
#   * West / South China Sea (&phw): W-facing; SW-monsoon (habagat, Jun-Oct)
#     windswell + W typhoon swell; offshore wind from the E (amihan season).
#   * East / Pacific (&phe): NE-E-facing; NE-monsoon (amihan, Nov-Mar) + Pacific
#     typhoon groundswell; offshore wind from the W-SW. Includes Siargao.
#
# ⚠ offshore_point: the loader default pushes 0.06° WEST - INLAND for the whole
# Pacific side, so every &phe spot carries a seaward offshore_bearing + offshore_km.
# North-facing spots (Pagudpud, Bagasbas, Lanuza) use wrap-through-0 swell
# windows (supported by transform.in_window).
#
# File order: N→S down the west/north coast, then N→S down the Pacific coast.
#
# CONFIDENCE: coordinates are approximate (well-known-spot knowledge, ~3 dp) and
# tagged "approx - TODO verify"; orientations reasoned from coastal facing, not
# surveyed. Same seed quality as costa-rica.yaml - calibrate before trusting.

west: &phw
  timezone: Asia/Manila
  height_coeff: 1.0
  break_type: beach
  swell_window: [200, 330]     # SSW → NW (monsoon windswell + typhoon W)
  ideal:
    wind_dir: [45, 135]        # metadata only (scorer uses offshore_direction)
    size_m: [0.6, 2.0]

east: &phe
  timezone: Asia/Manila
  height_coeff: 1.0
  break_type: reef
  swell_window: [20, 150]      # NNE → SE Pacific
  ideal:
    wind_dir: [225, 315]
    size_m: [0.8, 2.2]

spots:
