# Rosa spot database - Waikato west coast (seeded 2026-11-12).
# Raglan's neighbours north and south, Aotea to Marokopa and Port Waikato.
# W-SW Tasman groundswell; offshore in an easterly.
# Names and coordinates from the regional councils' coastal-plan surf break layers and the NZCPS 2010 schedule,
# cross-read with surf guides and tourism boards.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "New Zealand"

defaults: &wkt
  timezone: Pacific/Auckland
  height_coeff: 1.0
  break_type: beach
  swell_window: [221, 351]
  ideal:
    wind_dir: [61, 151]
    size_m: [0.6, 2.5]

