# Rosa spot database - Hainan, China (seeded 2026-10-29). China's surf capital: the east coast
# from Boao through Wanning (Riyue Bay, Shimei Bay, the Shenzhou peninsula) takes the NE monsoon
# swell Oct-Apr; the south coast round Sanya (Houhai, Yalong Bay, Dadonghai) takes the summer
# SW monsoon and typhoon swell. Warm water. Facing changes round the island, so every spot carries
# its own offshore_direction and swell_window; break_type per spot.

country: "China"

defaults: &hn
  timezone: Asia/Shanghai
  height_coeff: 1.0
  break_type: beach
  swell_window: [20, 200]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.6, 2.0]

spots:

  # ==== SEEDED 2026-10-29 - hainan, 11 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 11 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/hainan/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: ocean-bay-golf-club, name: "Ocean Bay Golf Club", town: "Wanning", lat: 18.6690, lon: 110.3533, offshore_direction: 62, swell_window: [177, 307], offshore_km: 5.0, break_type: point, <<: *hn }  # sat-verified 2026-10-29 (websearch-seeded); 3c: normal set by hand to seaward 242 (middle of the open arc on the GEBCO sweep; coastline candidate gave seaward 270)
