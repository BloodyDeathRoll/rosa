# Rosa spot database - Bunbury (seeded 2026-09-03 - closing the WA west-coast gaps). Mandurah to Cape Naturaliste: Myalup, Binningup, Bunbury's back beach; Geographe Bay is sheltered.
# West-facing Indian Ocean coast: SW groundswell year-round, the SE trade / land breeze offshore
# in the morning and the sea breeze onshore by afternoon. Every spot carries offshore_km along
# its own seaward normal; break_type per spot.

country: "Australia"

defaults: &bun
  timezone: Australia/Perth
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 300]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-09-03 - bunbury, 7 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 7 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/bunbury/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: myalup, name: "Myalup", town: "Myalup", lat: -33.1033, lon: 115.6875, offshore_direction: 84, swell_window: [199, 329], offshore_km: 5.0, <<: *bun }  # sat-verified 2026-09-03 (websearch-seeded)
  - { id: binningup, name: "Binningup", town: "Binningup", lat: -33.1549, lon: 115.6856, offshore_direction: 76, swell_window: [191, 321], offshore_km: 5.0, <<: *bun }  # sat-verified 2026-09-03 (websearch-seeded)
  - { id: buffalo-beach, name: "Buffalo Beach", town: "Binningup", lat: -33.2084, lon: 115.6837, offshore_direction: 86, swell_window: [201, 331], offshore_km: 5.0, <<: *bun }  # sat-verified 2026-09-03 (websearch-seeded)
  - { id: wyalup-rocky-point, name: "Wyalup Rocky Point", town: "Bunbury", lat: -33.3231, lon: 115.6308, offshore_direction: 121, swell_window: [236, 6], offshore_km: 5.0, <<: *bun }  # sat-verified 2026-09-03 (websearch-seeded)
  - { id: bunbury-back-beach, name: "Bunbury Back Beach", town: "Bunbury", lat: -33.3271, lon: 115.6294, offshore_direction: 99, swell_window: [214, 344], offshore_km: 5.0, <<: *bun }  # sat-verified 2026-09-03 (websearch-seeded)
  - { id: dalyellup, name: "Dalyellup", town: "Dalyellup", lat: -33.4061, lon: 115.6008, offshore_direction: 107, swell_window: [222, 352], offshore_km: 5.0, <<: *bun }  # sat-verified 2026-09-03 (websearch-seeded)
  - { id: peppermint-grove, name: "Peppermint Grove", town: "Peppermint Grove Beach", lat: -33.5146, lon: 115.5165, offshore_direction: 137, swell_window: [252, 22], offshore_km: 5.0, <<: *bun }  # sat-verified 2026-09-03 (websearch-seeded)
