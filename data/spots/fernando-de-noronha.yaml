# Rosa spot database - Fernando de Noronha (seeded 2026-09-11). The archipelago's north shore (Cacimba do Padre, Boldro) faces the North Atlantic NW-N groundswell of Dec-Mar; offshore on the SE trade.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

region: Fernando de Noronha
defaults: &fn
  timezone: America/Noronha
  height_coeff: 1.0
  break_type: beach
  swell_window: [270, 60]
  ideal:
    wind_dir: [100, 200]
    size_m: [1.0, 3.0]

