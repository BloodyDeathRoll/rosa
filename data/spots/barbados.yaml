# Rosa spot database - Barbados (seeded 2026-10-29). The east coast (Soup Bowl, Bathsheba,
# Cattlewash) faces the open Atlantic and takes the trade windswell and N-NE winter swell
# year round; the south coast (Freights, South Point, Brandons) runs on SE trade swell and
# tropical systems; the west coast reefs (Duppies, Tropicana) need a winter N swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Barbados"

defaults: &bb
  timezone: America/Barbados
  height_coeff: 1.0
  break_type: reef
  swell_window: [0, 160]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-10-29 - barbados, 24 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 24 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/barbados/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
