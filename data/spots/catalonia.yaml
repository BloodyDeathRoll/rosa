# Rosa spot database - Catalonia. The Costa Brava, Barcelona's Maresme and city beaches
# (Masnou, Barceloneta, Bogatell) and the Costa Daurada south to the Ebro delta: a
# SE-facing western Mediterranean coast that breaks on short-period E-S wind swell from
# Levante and Gregal storms, offshore on the NW mestral. Every spot carries offshore_km
# along its own seaward normal; break_type per spot.

country: "Spain"

defaults: &cat
  timezone: Europe/Madrid
  height_coeff: 1.0
  break_type: beach
  swell_window: [45, 225]
  ideal:
    wind_dir: [270, 360]
    size_m: [0.5, 1.5]

spots:

