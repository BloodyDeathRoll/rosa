# Rosa spot database - South Korea mainland (seeded 2026-10-29). The East Sea coast carries most
# of the surf: Gangwon (Goseong, Sokcho, Yangyang's Jukdo / Ingu / Surfyy Beach, Gangneung,
# Donghae), Gyeongbuk (Pohang, Yeongdeok), Ulsan and Busan on the south-east corner. A few
# west-coast (Taean) and south-coast (Goheung) beaches that surf sources name complete it.
# Typhoon swell (Aug-Oct) and winter NE wind swell; the W-NW winter monsoon is offshore on the
# east coast. Every spot carries offshore_km along its own seaward normal (the loader's default
# 0.06 deg W push is inland on this east-facing coast).

country: "South Korea"

defaults: &kr
  timezone: Asia/Seoul
  height_coeff: 1.0
  break_type: beach
  swell_window: [0, 160]
  ideal:
    wind_dir: [225, 315]       # metadata only (scorer uses offshore_direction)
    size_m: [0.6, 2.0]

spots:

  # ==== SEEDED 2026-10-29 - south-korea, 33 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 33 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/south-korea/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
