# Rosa spot database - Guatemala (seeded 2026-10-29). One coast only: the Pacific, a near
# straight black-sand shore facing SSW from Ocos on the Mexican border to Las Lisas near El
# Salvador - beach and rivermouth breaks (El Paredon, Sipacate, Iztapa, Monterrico) on S-SW
# Southern Ocean groundswell, Apr-Oct peak, same window as El Salvador.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Guatemala"

defaults: &gt
  timezone: America/Guatemala
  height_coeff: 1.0
  break_type: beach
  swell_window: [150, 260]
  ideal:
    wind_dir: [0, 60]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-10-29 - guatemala, 13 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 13 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/guatemala/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: ocos, name: "Ocos", town: "Ocós", lat: 14.5058, lon: -92.1958, offshore_direction: 39, swell_window: [154, 284], offshore_km: 5.0, <<: *gt }  # sat-verified 2026-10-29 (websearch-seeded)
