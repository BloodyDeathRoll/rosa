# Rosa spot database - South Africa (east coast) (seeded 2026-09-03 - East Africa). Jeffreys Bay's right-hand points and the KwaZulu-Natal beach and reef breaks. Southern Ocean SW-S groundswell year-round, biggest in winter; the land breeze is offshore in the morning.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "South Africa"

defaults: &sae
  timezone: Africa/Johannesburg
  height_coeff: 1.0
  break_type: reef
  swell_window: [130, 250]
  ideal:
    wind_dir: [270, 30]
    size_m: [0.8, 2.5]

spots:

