# Rosa spot database - WA South (seeded 2026-09-03 - closing WA's south coast). Augusta to Bremer Bay: Windy Harbour, Walpole, Denmark's Ocean Beach, Albany's Middleton and Nanarup.
# South-facing Southern Ocean coast: SW groundswell year-round, biggest in winter, cold water;
# offshore wind is from the N. Granite points and exposed beach breaks; break_type per spot.
# Every spot carries offshore_km along its own seaward normal.
country: "Australia"

region: "WA South"

defaults: &was
  timezone: Australia/Perth
  height_coeff: 1.0
  break_type: beach
  swell_window: [150, 270]
  ideal:
    wind_dir: [315, 45]
    size_m: [1.0, 3.0]

spots:

