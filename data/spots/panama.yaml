# Rosa spot database - Panama (seeded 2026-08-27). Two coasts with opposite seasons: the
# Pacific side (Santa Catalina, Playa Venao, Morro Negrito) runs on S-SW groundswell from
# April to October, and the Caribbean side (Bocas del Toro, Colon) on N-NE swell from
# December to March. Because the two shores face opposite ways, the per-spot offshore_km /
# offshore_bearing carry the geometry - the region default below is the Pacific case and
# every Caribbean spot overrides it.

defaults: &pa
  timezone: America/Panama
  height_coeff: 1.0
  break_type: beach
  swell_window: [160, 290]
  ideal:
    wind_dir: [340, 70]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-08-27 - panama, 23 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 23 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/panama/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
