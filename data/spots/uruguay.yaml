# Rosa spot database - Uruguay (seeded 2026-09-16). Montevideo east through Punta del Este, La Paloma and Punta del Diablo. A south-east-facing shelf coast: Southern Ocean groundswell wrapping in plus local S-SE wind swell, offshore on a N wind.
# Every spot carries offshore_km along its own seaward normal, so the deep-water sample follows
# the pin. Defaults are TODO calibrate.

country: "Uruguay"

region: Uruguay
defaults: &uy
  timezone: America/Montevideo
  height_coeff: 1.0
  break_type: beach
  swell_window: [100, 230]
  ideal:
    wind_dir: [315, 45]
    size_m: [0.6, 2.0]

