# Rosa spot database - Andalusia (Mediterranean). The Costa del Sol (Malaga province:
# Marbella, Fuengirola, Torremolinos, Malaga city), the Costa Tropical (Granada: La
# Herradura, Motril) and Almeria (Mojacar). A S-facing coast on short-period Levante (E)
# and Poniente (W) wind swell through the Alboran Sea, offshore on a N wind. The Atlantic
# side of Andalusia (Cadiz province, incl. Tarifa) is the cadiz region.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Spain"

defaults: &and
  timezone: Europe/Madrid
  height_coeff: 1.0
  break_type: beach
  swell_window: [70, 270]
  ideal:
    wind_dir: [315, 45]
    size_m: [0.5, 1.5]

