# Rosa spot database - Sweden: the Kattegat west coast (Halland), Skane and the Baltic east coast. Short-period wind swell; offshore direction varies per coast.
# Every spot carries offshore_km along its own seaward normal.

defaults: &se
  timezone: Europe/Stockholm
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 330]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.6, 1.8]

