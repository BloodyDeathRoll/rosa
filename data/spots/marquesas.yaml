# Rosa spot database - French Polynesia (seeded 2026-11-12, gap batch 2). Nuku Hiva's Haatuatua: NE trade swell and N Pacific winter swell, no reef shelter.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "French Polynesia"

defaults: &mq
  timezone: Pacific/Marquesas
  height_coeff: 1.0
  break_type: beach
  swell_window: [25, 155]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.5, 1.8]

spots:

  # ==== SEEDED 2026-11-12 - gap batch 2, 1 spots (web flow: names from tourism boards, councils,
  # news and prose guides, never competitor listings; pins on named OSM features (© OpenStreetMap
  # contributors, ODbL) or Nominatim / Photon, every pin rendered and judged at z16, re-read by the
  # coordinator on contact sheets; tools/spot-seed/work/gap2-north/). North to south.
  - { id: haatuatua, name: "Haatuatua", town: "Hatiheu", lat: -8.8321, lon: -140.0470, offshore_direction: 270, swell_window: [25, 155], offshore_km: 5.0, break_type: beach, <<: *mq }  # sat-verified 2026-11-12 (websearch-seeded, conf 0.65)
