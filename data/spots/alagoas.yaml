# Rosa spot database - Alagoas (seeded 2026-09-16). Maceio and the reef coast south to Barra de Sao Miguel. SE trade swell over shallow reef, offshore on a W wind.
# Every spot carries offshore_km along its own seaward normal, so the deep-water sample follows
# the pin. Defaults are TODO calibrate.

region: Alagoas
defaults: &al
  timezone: America/Maceio
  height_coeff: 1.0
  break_type: beach
  swell_window: [45, 180]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.6, 1.8]

