# Rosa spot database - Namibia. A west-facing South Atlantic desert coast: SW Southern Ocean
# groundswell wrapping into long sand points (Skeleton Bay) and Benguela-cold beach breaks
# around Swakopmund, Walvis Bay and Luderitz. The afternoon S-SW trade is onshore to
# cross-shore; offshore is the E "berg" wind off the desert. Every spot carries offshore_km
# along its own seaward normal.

defaults: &na
  timezone: Africa/Windhoek
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 300]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-09-29 - namibia, 10 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 10 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/namibia/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: torra-bay, name: "Torra Bay", town: "Torra Bay", lat: -20.3160, lon: 13.2339, offshore_direction: 49, swell_window: [164, 294], offshore_km: 5.0, <<: *na }  # sat-verified 2026-09-29 (websearch-seeded)
