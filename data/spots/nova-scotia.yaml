# Rosa spot database - Nova Scotia (seeded 2026-11-04). The Atlantic shore from Yarmouth to
# Cape Breton takes North Atlantic groundswell and, Aug-Oct, hurricane swell; Lawrencetown and
# the Eastern Shore are the core, the South Shore (Hirtle's to Summerville) and Cape Breton
# (Ingonish, Inverness on the Gulf side) the rest.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Canada"

defaults: &ns
  timezone: America/Halifax
  height_coeff: 1.0
  break_type: beach
  swell_window: [90, 230]
  ideal:
    wind_dir: [270, 30]
    size_m: [0.6, 2.5]

