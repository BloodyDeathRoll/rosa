# Rosa spot database - Goa (seeded 2026-10-29). Arabian Sea beach breaks from Arambol
# and Ashwem in the north to Agonda and Palolem in the south: SW monsoon swell (May-Sep, mostly
# onshore) and the cleaner pre/post-monsoon groundswell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "India"

defaults: &ga
  timezone: Asia/Kolkata
  height_coeff: 1.0
  break_type: beach
  swell_window: [190, 320]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.6, 2.0]

spots:

  # ==== SEEDED 2026-10-29 - goa, 11 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 11 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/goa/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: arambol, name: "Arambol", town: "Arambol", lat: 15.6790, lon: 73.7044, offshore_direction: 76, swell_window: [191, 321], offshore_km: 5.0, <<: *ga }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: mandrem, name: "Mandrem", town: "Mandrem", lat: 15.6601, lon: 73.7124, offshore_direction: 77, swell_window: [192, 322], offshore_km: 5.0, <<: *ga }  # sat-verified 2026-10-29 (websearch-seeded)
