  - { id: benaulim, name: "Benaulim", town: "Benaulim", lat: 15.2530, lon: 73.9196, offshore_direction: 74, swell_window: [189, 319], offshore_km: 5.0, <<: *ga }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: varca, name: "Varca", town: "Varca", lat: 15.2180, lon: 73.9301, offshore_direction: 72, swell_window: [187, 317], offshore_km: 5.0, <<: *ga }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: agonda, name: "Agonda", town: "Agonda", lat: 15.0423, lon: 73.9865, offshore_direction: 68, swell_window: [183, 313], offshore_km: 5.0, <<: *ga }  # sat-verified 2026-10-29 (websearch-seeded)
