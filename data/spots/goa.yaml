  - { id: baga, name: "Baga", town: "Calangute", lat: 15.5574, lon: 73.7501, offshore_direction: 71, swell_window: [186, 316], offshore_km: 5.0, <<: *ga }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: calangute, name: "Calangute", town: "Calangute", lat: 15.5425, lon: 73.7556, offshore_direction: 71, swell_window: [186, 316], offshore_km: 5.0, <<: *ga }  # sat-verified 2026-10-29 (websearch-seeded)
