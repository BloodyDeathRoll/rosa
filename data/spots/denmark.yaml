# Rosa spot database - Denmark: Jutland's North Sea coast (Cold Hawaii, Hvide Sande, Lokken) and north Zealand's Kattegat shore. Short-period North Sea wind swell from the W-NW; offshore on an E wind.
# Every spot carries offshore_km along its own seaward normal.

country: "Denmark"

defaults: &dk
  timezone: Europe/Copenhagen
  height_coeff: 1.0
  break_type: beach
  swell_window: [200, 20]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.6, 2.0]

