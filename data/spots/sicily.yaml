# Rosa spot database - Sicily. Central Mediterranean wind swell: the north coast (Palermo,
# Cefalu) takes the Tyrrhenian's NW-N mistral swell, the west (Trapani, San Vito) the W-NW,
# the south coast (Agrigento, Gela, Ragusa) the SW-S from the Strait of Sicily, and the east
# (Catania, Siracusa) the Ionian's SE-E. Short-period, like Cyprus. Offshore direction
# varies per coast. Every spot carries offshore_km along its own seaward normal.

defaults: &sic
  timezone: Europe/Rome
  height_coeff: 1.0
  break_type: beach
  swell_window: [240, 30]
  ideal:
    wind_dir: [90, 180]
    size_m: [0.6, 1.5]

