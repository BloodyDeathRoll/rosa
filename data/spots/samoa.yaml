# Rosa spot database - Samoa (region seeded 2026-09-21, retried same day with tighter
# disambiguating geocode queries). Upolu and Savai'i. OSM carries zero named surf
# features; web-search + Google geocode + sat-verify. Boulders, Dragons Breath, Salani
# Right and Pudding Rock all washed out again (two collapsed onto the same duplicate
# coordinate, one landed in a river mouth, one landed deep inland in forest) - dropped
# rather than guessed. Satuiatua Beach stayed fully cloud-obscured on the sat tile both
# passes, dropped. Aganoa Beach's pin looked coastal but aim_normal.py's GEBCO sweep
# found no seaward bearing that clears land at any of the 180 steps swept - a notch
# GEBCO cannot resolve through - so it was dropped too rather than committing a ray
# that starts on land. offshore_direction re-aimed by aim_normal.py's GEBCO arc sweep
# for the rest.

country: "Samoa"

defaults: &ws
  timezone: Pacific/Apia
  height_coeff: 1.0
  break_type: reef
  swell_window: [150, 280]
  ideal:
    wind_dir: [20, 110]
    size_m: [0.6, 2.5]

spots:

