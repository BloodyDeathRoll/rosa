# Rosa spot database - Mentawai (seeded 2026-09-03 - Indonesia's fourth region, the first
# boat-access chain). Siberut, Sipora and the Pagais: reef passes and points facing SW into
# Indian Ocean groundswell year-round, biggest Apr-Oct; the dry-season SE trade is offshore
# on the west-facing breaks. Reef throughout; swell_window and offshore_direction per spot.
# Towns are the island or the nearest village - most breaks have no settlement within 12 km.

country: "Indonesia"

defaults: &mtw
  timezone: Asia/Jakarta
  height_coeff: 1.0
  break_type: reef
  swell_window: [170, 290]
  ideal:
    wind_dir: [60, 150]
    size_m: [1.0, 3.0]

spots:

  # ==== SEEDED 2026-09-03 - mentawai, 15 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 15 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/mentawai/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: rifles, name: "Rifles", town: "Playgrounds", lat: -1.7914, lon: 99.2546, offshore_direction: 60, swell_window: [175, 305], offshore_km: 5.0, <<: *mtw }  # sat-verified 2026-09-03 (websearch-seeded)
