# Rosa spot database - Gironde (seeded 2026-11-12). The Medoc coast, Le Verdon to Cap Ferret: exposed W-facing
# beach break on shifting bars, best autumn to spring on an E wind. Lacanau, Le Porge and Le Grand Crohot
# are in landes.yaml (seeded earlier).
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "France"

defaults: &gir
  timezone: Europe/Paris
  height_coeff: 1.0
  break_type: beach
  swell_window: [210, 340]
  ideal:
    wind_dir: [50, 140]
    size_m: [0.8, 2.5]

