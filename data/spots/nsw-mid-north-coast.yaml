# Rosa spot database - NSW Mid North Coast (seeded 2026-11-04). Angourie and Yamba down through
# Crescent Head, South West Rocks, Coffs Harbour, Port Macquarie, Forster and Seal Rocks to
# Newcastle: the right-hand points of the Tasman coast on S-SE groundswell (biggest in winter) and
# NE windswell in summer, between the byron-bay and sydney boxes. Offshore is W.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

