# Rosa spot database - Peru (seeded 2026-08-27). A west-facing Pacific coast that gets both
# hemispheres: big S-SW groundswell out of the Southern Ocean in the austral winter and NW
# North-Pacific swell in the austral summer. Long left points on the north coast (Chicama is
# the longest wave on earth), heavy reef and beachbreak around Lima. Cold Humboldt water the
# whole way. Offshore wind is easterly off the land. Every spot carries offshore_km along its
# own seaward normal, so the sample point follows the pin.

defaults: &pe
  timezone: America/Lima
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 310]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 3.0]

spots:

