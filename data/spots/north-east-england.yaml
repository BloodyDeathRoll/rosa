# Rosa spot database - North East England (seeded 2026-09-03). North Sea coast facing E-NE: short-period N-NE windswell, biggest in autumn and winter; offshore on a W-SW wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "United Kingdom"

defaults: &nee
  timezone: Europe/London
  height_coeff: 1.0
  break_type: beach
  swell_window: [340, 120]
  ideal:
    wind_dir: [200, 300]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-09-03 - north-east-england, 10 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 10 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/north-east-england/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: blyth, name: "Blyth", town: "Blyth", lat: 55.1125, lon: -1.4966, offshore_direction: 279, swell_window: [34, 164], offshore_km: 5.0, <<: *nee }  # sat-verified 2026-09-03 (websearch-seeded)
