# Rosa spot database - Emilia-Romagna (seeded 2026-11-12). Ravenna to Rimini on the northern Adriatic:
# NE bora and SE scirocco wind swell, short period, breaks keyed to jetties and river mouths.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Italy"

