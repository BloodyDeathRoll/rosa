# Rosa spot database - Lombok (seeded 2026-09-02, with sumbawa - the second and third
# Indonesian regions after bali, same recipe). Desert Point on the SW tip, the south-coast bays around Kuta, Senggigi in the west.
# SW Indian Ocean groundswell year-round, biggest May-Oct with the SE trade offshore on the
# south and west coasts. Reef throughout; swell_window and offshore_direction are per spot.

defaults: &lom
  timezone: Asia/Makassar
  height_coeff: 1.0
  break_type: reef
  swell_window: [180, 290]
  ideal:
    wind_dir: [60, 150]
    size_m: [1.0, 3.0]

spots:

  # ==== SEEDED 2026-09-02 - lombok, 16 spots (primary coastline flow: 2 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 14 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/lombok/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: gili-trawangan, name: "Gili Trawangan", town: "Gili Trawangan", lat: -8.3621, lon: 116.0394, offshore_direction: 64, swell_window: [179, 309], offshore_km: 5.0, <<: *lom }  # sat-verified 2026-09-02 (websearch-seeded)  [normal re-aimed by GEBCO arc sweep: island/bay shadow]
