  - { id: black-rock-raro, name: "Black Rock", town: "Rarotonga", lat: -21.2078, lon: -159.8236, offshore_direction: 144, swell_window: [229, 59], offshore_km: 5.0, <<: *ck }  # sat-verified 2026-09-21 (websearch-seeded); reef edge break clearly visible; normal re-aimed by GEBCO arc sweep (90 clipped land x2, 144 is the sweep's best, 1 near-shore cell remains - non-disqualifying)
