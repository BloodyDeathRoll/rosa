# Rosa spot database - Cook Islands (region seeded 2026-09-21). Rarotonga only -
# Aitutaki's reef is a closeout/kitesurf destination with no named surf break in any
# guide, so it was left unscoped. OSM carries zero named surf features; web-search
# flow only. Rutaki Passage's geocode landed inland (village, not the reef channel)
# and was dropped. offshore_direction re-aimed by aim_normal.py's GEBCO arc sweep.

defaults: &ck
  timezone: Pacific/Rarotonga
  height_coeff: 1.0
  break_type: reef
  swell_window: [150, 280]
  ideal:
    wind_dir: [20, 110]
    size_m: [0.6, 2.5]

spots:

  # ==== WEB-SEARCH SEEDED (2026-09-21, google-geocoded, sat-verified) ====
