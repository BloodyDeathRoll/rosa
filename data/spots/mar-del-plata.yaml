# Rosa spot database - Mar del Plata (seeded 2026-09-16). Argentina's Buenos Aires coast - Mar del Plata's city beaches, Miramar, Necochea and Claromeco. E-SE facing beachbreak on a wide shallow shelf, offshore on a W wind.
# Every spot carries offshore_km along its own seaward normal, so the deep-water sample follows
# the pin. Defaults are TODO calibrate.

region: Mar del Plata
defaults: &mdp
  timezone: America/Argentina/Buenos_Aires
  height_coeff: 1.0
  break_type: beach
  swell_window: [45, 200]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.6, 2.0]

