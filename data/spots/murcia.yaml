# Rosa spot database - Murcia. La Manga and the Mar Menor's outer shore, Calblanque and
# Portman: an E-SE-facing western Mediterranean coast on short-period Levante wind swell,
# offshore on the W-NW. Every spot carries offshore_km along its own seaward normal;
# break_type per spot.

country: "Spain"

defaults: &mur
  timezone: Europe/Madrid
  height_coeff: 1.0
  break_type: beach
  swell_window: [20, 200]
  ideal:
    wind_dir: [240, 330]
    size_m: [0.5, 1.5]

spots:

