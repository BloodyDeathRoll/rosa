# Rosa spot database - Reunion (seeded 2026-10-29). French volcanic island 200 km WSW of
# Mauritius. The surf is the west coast's fringing reef (Saint-Leu, Trois-Bassins, Boucan,
# Roches Noires / Saint-Gilles, Saint-Paul, Etang-Sale), the south (Saint-Pierre, Manapany)
# on Southern Ocean SW groundswell, and the east (Saint-Benoit, Sainte-Marie) on trade-wind
# swell and cyclone swell. The ESE trade is offshore on the west coast.
# Shark risk: a prefectoral bathing and surfing ban has covered most of the coast since 2013
# (outside the reef lagoons and a few supervised zones). Rosa forecasts the waves; it does not
# say whether a spot is legal or safe to surf.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Réunion"

defaults: &re
  timezone: Indian/Reunion
  height_coeff: 1.0
  break_type: reef
  swell_window: [180, 300]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

spots:

