# Rosa spot database - Queensland Central (seeded 2026-11-12). Double Island Point, Bargara, Agnes Water / 1770 and the
# Capricorn Coast: SE trade swell and E-NE cyclone swell, shadowed by K'gari and the Great Barrier Reef north of
# Double Island Point, so small and fickle from Bundaberg north. Agnes Water is the northernmost reliable surf.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Australia"

