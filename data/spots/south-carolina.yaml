# Rosa spot database - South Carolina (seeded 2026-10-09). The Grand Strand piers from Cherry
# Grove to Garden City and Surfside, Isle of Palms, Folly Beach and the Washout, Edisto and
# Hunting Island: south-east-facing barrier beach on hurricane swell and NE windswell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &sc
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [45, 200]
  ideal:
    wind_dir: [250, 340]
    size_m: [0.5, 2.0]

spots:

  # ==== SEEDED 2026-10-09 - south-carolina, 11 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 11 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/south-carolina/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: cherry-grove-pier, name: "Cherry Grove Pier", town: "Cherry Grove Beach", lat: 33.8294, lon: -78.6322, offshore_direction: 341, swell_window: [96, 226], offshore_km: 5.0, <<: *sc }  # sat-verified 2026-10-09 (websearch-seeded)
  - { id: apache-pier, name: "Apache Pier", town: "Myrtle Beach", lat: 33.7635, lon: -78.7807, offshore_direction: 320, swell_window: [75, 205], offshore_km: 5.0, <<: *sc }  # sat-verified 2026-10-09 (websearch-seeded)
