# Rosa spot database - Netherlands: the Dutch North Sea coast, Zeeland to the Wadden. Short-period wind swell from the SW-N; offshore on an E wind.
# Every spot carries offshore_km along its own seaward normal.

defaults: &nl
  timezone: Europe/Amsterdam
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 20]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.6, 1.8]

