# Rosa spot database - Lofoten: the Lofoten islands above the Arctic Circle: Norwegian Sea swell from the W-N onto the outer islands' north-west beaches.
# Every spot carries offshore_km along its own seaward normal.

country: "Norway"

defaults: &lof
  timezone: Europe/Oslo
  height_coeff: 1.0
  break_type: beach
  swell_window: [240, 30]
  ideal:
    wind_dir: [90, 180]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-09-29 - lofoten, 9 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 9 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/lofoten/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
