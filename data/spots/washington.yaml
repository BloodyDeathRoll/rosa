# Rosa spot database - Washington (seeded 2026-08-26, the third US west coast region).
# Outer Olympic coast plus the Strait of Juan de Fuca mouth: W-NW groundswell, cold water,
# long drives, few crowds. Offshore wind is from the east. Every spot carries offshore_km
# along its own seaward normal, so the sample point follows the pin.

country: "USA"

defaults: &wa
  timezone: America/Los_Angeles
  height_coeff: 1.0
  break_type: beach
  swell_window: [200, 330]
  ideal:
    wind_dir: [50, 130]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-08-26 - washington, 22 spots (primary coastline flow: 1 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 21 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/washington/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: hobuck-beach, name: "Hobuck Beach", town: "Wa'atch", lat: 48.3387, lon: -124.6666, offshore_direction: 40, swell_window: [155, 285], offshore_km: 5.0, <<: *wa }  # sat-verified 2026-08-26 (websearch-seeded)
