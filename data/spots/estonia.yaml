# Rosa spot database - Estonia (seeded 2026-11-12, gap batch 3). Ristna on Hiiumaa's west tip: open Baltic, W-SW autumn storm swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Estonia"

defaults: &ee
  timezone: Europe/Tallinn
  height_coeff: 1.0
  break_type: beach
  swell_window: [185, 315]
  ideal:
    wind_dir: [25, 115]
    size_m: [0.5, 1.8]

spots:

  # ==== SEEDED 2026-11-12 - gap batch 3, 1 spots (web flow: names from tourism boards, councils,
  # news and prose guides, never competitor listings; pins on named OSM features (© OpenStreetMap
  # contributors, ODbL) or Nominatim / Photon, every pin rendered and judged at z16, re-read by the
  # coordinator on contact sheets; tools/spot-seed/work/gap3-nordic/). North to south.
  - { id: ristna, name: "Ristna", town: "Hiiumaa", lat: 58.9390, lon: 22.0496, offshore_direction: 70, swell_window: [185, 315], offshore_km: 5.0, break_type: beach, <<: *ee }  # sat-verified 2026-11-12 (websearch-seeded, conf 0.75)
