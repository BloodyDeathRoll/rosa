# Rosa spot database - Charente-Maritime (seeded 2026-11-12). Ile de Re, Ile d'Oleron and the Cote Sauvage
# to Royan: the islands filter the swell; west Oleron and the Cote Sauvage are open W-facing beach break.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

