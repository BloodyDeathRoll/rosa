# Rosa spot database - Aruba (seeded 2026-11-26). The windward north-east coast, Boca Grandi to the California Lighthouse: NE trade windswell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Aruba"

defaults: &aw
  timezone: America/Aruba
  height_coeff: 1.0
  break_type: beach
  swell_window: [335, 105]
  ideal:
    wind_dir: [175, 265]
    size_m: [0.6, 1.8]

