# Rosa spot database - Bahia (seeded 2026-09-11). East-facing beaches and reefs (Itacare, Salvador, Praia do Forte): SE trade swell and S groundswell, offshore on a W wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

region: Bahia
defaults: &ba
  timezone: America/Bahia
  height_coeff: 1.0
  break_type: beach
  swell_window: [45, 200]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.6, 2.0]

