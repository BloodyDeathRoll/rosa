# Rosa spot database - Pohnpei (seeded 2026-11-12). Reef passes round the barrier reef: P-Pass (Palikir), Mwahnd,
# Nahpali, Nan Madol, Nahlap. N-NE North Pacific swell, Oct-Mar.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Micronesia"

defaults: &pni
  timezone: Pacific/Pohnpei
  height_coeff: 1.0
  break_type: reef
  swell_window: [1, 131]
  ideal:
    wind_dir: [201, 291]
    size_m: [0.8, 2.5]

