# Rosa spot database - Espirito Santo (seeded 2026-09-11). An east-facing coast (Guarapari, Regencia) on SE-E swell, offshore on a W wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Brazil"

region: Espirito Santo
