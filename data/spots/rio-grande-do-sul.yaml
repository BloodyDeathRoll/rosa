# Rosa spot database - Rio Grande do Sul (seeded 2026-09-11). A straight east-facing sand coast (Torres, Tramandai): S-SE groundswell and E wind swell, offshore on a W wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Brazil"

region: Rio Grande do Sul
defaults: &rs
  timezone: America/Sao_Paulo
  height_coeff: 1.0
  break_type: beach
  swell_window: [60, 200]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.8, 2.0]

