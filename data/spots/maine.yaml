# Rosa spot database - Maine (seeded 2026-10-09). York to Acadia: south- and east-facing
# beaches and ledges on nor'easter and hurricane swell. Every spot carries its own
# offshore_direction and swell_window; break_type per spot.

country: "USA"

defaults: &me
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [60, 200]
  ideal:
    wind_dir: [270, 360]
    size_m: [0.6, 2.5]

spots:

