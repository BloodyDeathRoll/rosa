# Rosa spot database - Gulf Coast (seeded 2026-11-12). Alabama (Orange Beach, Gulf Shores, Dauphin Island) and
# Louisiana (Grand Isle, Holly Beach): small wind swell off winter fronts and tropical storms.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "United States"

defaults: &gc
  timezone: America/Chicago
  height_coeff: 1.0
  break_type: beach
  swell_window: [100, 230]
  ideal:
    wind_dir: [300, 30]
    size_m: [0.4, 1.5]

