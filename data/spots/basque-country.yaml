# Rosa spot database - the Spanish Basque coast (seeded 2026-09-10). North-facing Biscay beaches
# (Zarautz, Sopelana) and the Mundaka rivermouth left: NW groundswell, offshore on a S wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &eus
  timezone: Europe/Madrid
  height_coeff: 1.0
  break_type: beach
  swell_window: [270, 30]
  ideal:
    wind_dir: [135, 225]
    size_m: [0.8, 2.5]

spots:

