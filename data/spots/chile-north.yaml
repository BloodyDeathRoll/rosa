# Rosa spot database - Chile North (seeded 2026-09-16). The desert coast - Arica, Iquique and Antofagasta. Reef and point breaks on a west-facing shore that takes S-SW Southern Ocean groundswell all year and NW North-Pacific swell in the austral summer; offshore on an E wind off the Atacama.
# Every spot carries offshore_km along its own seaward normal, so the deep-water sample follows
# the pin. Defaults are TODO calibrate.

region: Chile North
country: "Chile"

defaults: &cln
  timezone: America/Santiago
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 310]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 3.0]

spots:

  # ==== SEEDED 2026-09-16 - chile-north, 30 spots. The primary coastline flow found 1442
  # bathy-passed candidates and ZERO OSM surf beacons (74 named beaches only), so every spot
  # here came from the secondary web-search flow (Spanish-language Chilean surf guides +
  # surf-forecast / wannasurf break lists), multi-geocoded (Google + Nominatim + Photon) and
  # cross-read against the OSM named-beach beacons. EVERY pin was rendered on ESRI imagery at
  # z16 and judged before entering; unplaceable pins got a z14/z15 wide read and were moved or
  # dropped (judge log in tools/spot-seed/work/chile-north/judge.json).
  # offshore_direction is the nearest coastline candidate's shore normal, re-aimed where the
  # GEBCO arc sweep showed the ray blocked; swell_window = seaward +/-65 deg, TODO calibrate.
