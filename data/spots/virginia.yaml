# Rosa spot database - Virginia (seeded 2026-10-29). Virginia Beach from the North End and First
# Street Jetty through Croatan, Camp Pendleton and Dam Neck to Sandbridge, plus the Eastern
# Shore: east-facing beach, jetties and piers on North Atlantic groundswell, nor'easters and
# Aug-Oct hurricane swell; offshore on a W wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "USA"

defaults: &va
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [25, 165]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.6, 2.5]

spots:

  # ==== SEEDED 2026-10-29 - virginia, 13 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 13 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/virginia/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: chincoteague, name: "Chincoteague", town: "Chincoteague", lat: 37.8895, lon: -75.3418, offshore_direction: 298, swell_window: [53, 183], offshore_km: 5.0, <<: *va }  # sat-verified 2026-10-29 (websearch-seeded); normal set by hand to seaward 118 from the tile
  - { id: grandview-va, name: "Grandview", town: "Hampton", lat: 37.0948, lon: -76.2743, offshore_direction: 240, swell_window: [355, 125], offshore_km: 5.0, <<: *va }  # sat-verified 2026-10-29 (websearch-seeded)
