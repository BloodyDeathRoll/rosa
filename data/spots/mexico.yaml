  - { id: la-fonda,          name: "La Fonda", town: "Santa Anita",          lat: 32.1199, lon: -116.8863, offshore_direction: 83, swell_window: [198, 328], offshore_km: 5.0, timezone: America/Tijuana, <<: *mx }  # sat-verified 2026-08-15
  - { id: salsipuedes,       name: "Salsipuedes", town: "La Salina",       lat: 31.9777, lon: -116.8240, offshore_direction: 352, swell_window: [107, 237], offshore_km: 5.0, break_type: point, timezone: America/Tijuana, <<: *mx }  # sat-verified 2026-08-15 (OSM cape Punta Salsipuedes)
  - { id: san-miguel,        name: "San Miguel", town: "San Miguel (Cíbolas de Mar)",        lat: 31.9021, lon: -116.7449, offshore_direction: 23, swell_window: [138, 268], offshore_km: 5.0, break_type: point, timezone: America/Tijuana, <<: *mx }  # sat-verified 2026-08-15 (cobble right at Punta San Miguel)
  - { id: killers,           name: "Killers", town: "Ensenada",           lat: 31.8130, lon: -116.8080, offshore_direction: 99, swell_window: [214, 344], offshore_km: 5.0, break_type: reef, timezone: America/Tijuana, <<: *mx }  # sat-verified 2026-08-16 (Isla Todos Santos NW point, boat access, big-wave)
  - { id: punta-san-jose,    name: "Punta San José", town: "La Bocana",    lat: 31.4613, lon: -116.5963, offshore_direction: 52, swell_window: [167, 297], offshore_km: 5.0, break_type: point, timezone: America/Tijuana, <<: *mx }  # sat-verified 2026-08-15
