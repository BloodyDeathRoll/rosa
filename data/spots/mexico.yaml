# Rosa spot database - Mexico (worldwide expansion)
#
# Pacific side only. The Gulf of Mexico and the Caribbean coast have no established
# spot set worth forecasting and are outside the seeded bbox.
#
# The coast changes facing four times along its length, so nothing here can share one
# orientation: Baja Norte/Sur face W-NW into North Pacific winter groundswell; the
# mainland from Nayarit to Guerrero faces SW; Oaxaca (Puerto Escondido, Barra de la
# Cruz) faces S-SSW straight into Southern Ocean summer swell. Every spot therefore
# carries its own offshore_direction, swell_window, and offshore_km so the deep-water
# sample follows its own seaward normal rather than the loader's westward default.
#
# Timezones also change along the coast: America/Tijuana (Baja Norte),
# America/Mazatlan (Baja Sur, Sonora, Sinaloa, Nayarit), America/Mexico_City
# (Jalisco southward). The anchor default is Mexico_City; northern spots override.
#
# CONFIDENCE: coordinates are coastline-generated + OSM-name confirmed, then
# sat-verified per spot (see per-line tags). Orientations derive from coastline
# geometry, not survey - calibrate before trusting.

country: "Mexico"

defaults: &mx
  timezone: America/Mexico_City
  height_coeff: 1.0
  break_type: beach
  swell_window: [160, 300]     # SSE → WNW Pacific
  ideal:
    wind_dir: [0, 90]          # metadata only (scorer uses offshore_direction)
    size_m: [0.8, 2.5]

spots:
