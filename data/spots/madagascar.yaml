  - { id: libanona, name: "Libanona", town: "Fort Dauphin", lat: -25.0360, lon: 46.9830, offshore_direction: 320, swell_window: [75, 205], offshore_km: 5.0, <<: *mad }  # sat-verified 2026-09-04 (websearch-seeded)

