# Rosa spot database - Mauritius (seeded 2026-09-04). Volcanic island exposed to Indian Ocean and Southern Ocean swell on all sides; reef breaks dominate.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Mauritius"

defaults: &mau
  timezone: Indian/Mauritius
  height_coeff: 1.0
  break_type: reef
  swell_window: [120, 220]
  ideal:
    wind_dir: [250, 20]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-09-04 - mauritius, 10 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 10 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/mauritius/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
