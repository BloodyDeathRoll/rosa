# Rosa spot database - Patagonia Argentina (seeded 2026-09-16). Rio Negro and Chubut - El Condor
# and Las Grutas on the Rio Negro coast, Playa Union / Rawson and Rada Tilly further south. Cold, windy, east-facing; offshore on a W wind.
# Every spot carries offshore_km along its own seaward normal, so the deep-water sample follows
# the pin. Defaults are TODO calibrate.

country: "Argentina"

region: Patagonia Argentina
defaults: &cbt
  timezone: America/Argentina/Buenos_Aires
  height_coeff: 1.0
  break_type: beach
  swell_window: [45, 200]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.6, 2.0]

spots:

  # ==== SEEDED 2026-09-16 - chubut, 16 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 16 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/chubut/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
