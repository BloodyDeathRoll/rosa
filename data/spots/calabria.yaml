# Rosa spot database - Calabria (seeded 2026-11-04). The Tyrrhenian coast (Scalea to Zambrone) on W-SW mistral and
# libeccio swell, and the Ionian coast (Bova Marina round Capo Spartivento to Soverato) on S-SE
# scirocco and E levante swell; short-period wind swell on both, best Oct-Apr.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Italy"

defaults: &cal
  timezone: Europe/Rome
  height_coeff: 1.0
  break_type: beach
  swell_window: [90, 300]
  ideal:
    wind_dir: [270, 90]
    size_m: [0.6, 1.5]

