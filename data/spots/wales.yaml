# Rosa spot database - Wales (seeded 2026-09-03). Gower and Pembrokeshire: SW-facing beaches and reefs, offshore on a NE wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &wal
  timezone: Europe/London
  height_coeff: 1.0
  break_type: beach
  swell_window: [190, 300]
  ideal:
    wind_dir: [10, 110]
    size_m: [0.8, 2.5]

spots:

