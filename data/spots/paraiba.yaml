# Rosa spot database - Paraiba (seeded 2026-09-16). Brazil's easternmost coast - Joao Pessoa's city beaches and the reef-fringed south (Tambaba). SE trade swell, offshore on a W wind.
# Every spot carries offshore_km along its own seaward normal, so the deep-water sample follows
# the pin. Defaults are TODO calibrate.

region: Paraiba
defaults: &pb
  timezone: America/Recife
  height_coeff: 1.0
  break_type: beach
  swell_window: [45, 180]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.6, 1.8]

spots:

  # ==== SEEDED 2026-09-16 - paraiba, 17 spots, all from the secondary web-search flow
  # (multi-geocoded, then read against OSM named beaches; © OpenStreetMap contributors, ODbL
  # for the beach/coastline geometry). The primary coastline flow returned 372 bathy-passed
  # candidates and exactly ONE Tier-A surf node - Pontal de Baía Formosa, which is in Rio
  # Grande do Norte and already seeded there, because this box's N edge overruns the state
  # border; it was skipped. EVERY pin was rendered on ESRI imagery (z15, then z17 for every
  # move) and judged before entering (judge log in tools/spot-seed/work/paraiba/judge.json).
  # offshore_direction is the nearest coastline candidate's shore normal; swell_window =
  # seaward +/-65 deg, TODO calibrate; towns are the municipalities, set by hand. North to south.
