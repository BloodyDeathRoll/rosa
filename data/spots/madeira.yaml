# Rosa spot database - Madeira and Porto Santo (seeded 2026-10-29). Boulder points and lava
# reefs under the cliffs: the south-west coast (Jardim do Mar, Ponta Pequena, Paul do Mar) takes
# the NW North Atlantic groundswell wrapping the island with the NE trades offshore; the north
# shore faces the swell head-on. Same open North Atlantic swell as the Canaries, ~450 km south.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Portugal"

defaults: &mad
  timezone: Atlantic/Madeira
  height_coeff: 1.0
  break_type: reef
  swell_window: [230, 20]
  ideal:
    wind_dir: [20, 120]
    size_m: [1.0, 3.0]

spots:

