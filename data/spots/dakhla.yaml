# Rosa spot database - Dakhla (seeded 2026-11-04). The Atlantic side of the Dakhla peninsula: long
# right-hand points on N-NW North Atlantic groundswell (Oct-Apr) with the near-constant N trade wind,
# which blows side-offshore down the west-facing points. The lagoon side is kite water, not surf.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

