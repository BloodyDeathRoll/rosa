# Rosa spot database - Ecuador (seeded 2026-09-16). The mainland coast - Montanita and Ayampe in the south, Manta, Canoa and Mompiche north. S-SW groundswell in the austral winter, NW swell Dec-Mar, warm water; offshore on an E wind. The Galapagos are not seeded.
# Every spot carries offshore_km along its own seaward normal, so the deep-water sample follows
# the pin. Defaults are TODO calibrate.

country: "Ecuador"

region: Ecuador
defaults: &ec
  timezone: America/Guayaquil
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 310]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

