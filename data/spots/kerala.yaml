# Rosa spot database - Kerala (seeded 2026-10-29). The Arabian Sea coast from Kannur and Kozhikode
# south through Cherai to Varkala, Kovalam and Poovar: SW monsoon swell and Southern Ocean
# groundswell wrapping up the coast.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "India"

defaults: &kl
  timezone: Asia/Kolkata
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 310]
  ideal:
    wind_dir: [30, 120]
    size_m: [0.6, 2.0]

spots:

  # ==== SEEDED 2026-10-29 - kerala, 10 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 10 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/kerala/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: kannur, name: "Kannur", town: "Kannur", lat: 11.8814, lon: 75.3438, offshore_direction: 52, swell_window: [167, 297], offshore_km: 5.0, <<: *kl }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: mahe, name: "Mahe", town: "Mahe", lat: 11.6953, lon: 75.5344, offshore_direction: 91, swell_window: [206, 336], offshore_km: 5.0, <<: *kl }  # sat-verified 2026-10-29 (websearch-seeded)
