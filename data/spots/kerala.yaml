  - { id: thottappally, name: "Thottappally", town: "Thottappally", lat: 9.3158, lon: 76.3789, offshore_direction: 65, swell_window: [180, 310], offshore_km: 5.0, <<: *kl }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: kappil, name: "Kappil", town: "Kappil", lat: 8.7687, lon: 76.6823, offshore_direction: 54, swell_window: [169, 299], offshore_km: 5.0, <<: *kl }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: edava, name: "Edava", town: "Edava", lat: 8.7503, lon: 76.6936, offshore_direction: 45, swell_window: [160, 290], offshore_km: 5.0, <<: *kl }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: varkala, name: "Varkala", town: "Varkala", lat: 8.7361, lon: 76.7030, offshore_direction: 59, swell_window: [174, 304], offshore_km: 5.0, <<: *kl }  # sat-verified 2026-10-29 (websearch-seeded)
  - { id: hawa-beach, name: "Hawa Beach", town: "Kovalam", lat: 8.3887, lon: 76.9760, offshore_direction: 50, swell_window: [165, 295], offshore_km: 5.0, <<: *kl }  # sat-verified 2026-10-29 (websearch-seeded); normal re-aimed by hand to seaward 230 (3c gate)
  - { id: kovalam-lighthouse-beach, name: "Kovalam Lighthouse Beach", town: "Kovalam", lat: 8.3853, lon: 76.9791, offshore_direction: 347, swell_window: [102, 232], offshore_km: 5.0, <<: *kl }  # sat-verified 2026-10-29 (websearch-seeded)
