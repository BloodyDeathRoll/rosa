# Rosa spot database - Dominican Republic (seeded 2026-10-29). The north (Amber) coast carries
# most of the surf - Puerto Plata, Sosua, Cabarete, Encuentro, Rio San Juan, Nagua - on open
# North Atlantic winter swell (Nov-Mar) and the NE trade windswell; the east (Macao, Punta
# Cana) takes the trade swell, and the south coast (Santo Domingo, Bani, Barahona) runs on
# Caribbean S swell and tropical systems.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Dominican Republic"

defaults: &do
  timezone: America/Santo_Domingo
  height_coeff: 1.0
  break_type: beach
  swell_window: [290, 90]
  ideal:
    wind_dir: [135, 225]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-10-29 - dominican-republic, 23 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 23 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/dominican-republic/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
