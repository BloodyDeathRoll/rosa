# Rosa spot database - Jamaica (seeded 2026-11-12). Bull Bay and Port Royal near Kingston, Boston Bay and Long Bay
# in Portland: SE trade wind swell in summer on the south-east coast, N-NE winter swell on Portland.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Jamaica"

defaults: &jm
  timezone: America/Jamaica
  height_coeff: 1.0
  break_type: beach
  swell_window: [64, 194]
  ideal:
    wind_dir: [264, 354]
    size_m: [0.8, 2.0]

