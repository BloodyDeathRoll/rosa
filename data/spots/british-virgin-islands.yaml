# Rosa spot database - British Virgin Islands (seeded 2026-11-04). Tortola's north shore - Cane Garden
# Bay, Apple Bay / Bomba's, Josiah's Bay - on the same N-NE North Atlantic winter groundswell as
# Puerto Rico's Rincon, 100 km west (Nov-Mar); flat most of the summer. Offshore is S-SE.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "British Virgin Islands"

defaults: &bvi
  timezone: America/Tortola
  height_coeff: 1.0
  break_type: beach
  swell_window: [280, 80]
  ideal:
    wind_dir: [120, 220]
    size_m: [0.8, 2.5]

spots:

