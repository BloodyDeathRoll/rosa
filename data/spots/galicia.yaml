# Rosa spot database - Galicia (seeded 2026-09-10). Spain's Atlantic corner: the north coast
# around Ferrol (Pantin, Doninos) faces N-NW, the Costa da Morte and Rias Baixas face W.
# Open to every NW-SW North Atlantic swell; offshore on an E wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Spain"

defaults: &gal
  timezone: Europe/Madrid
  height_coeff: 1.0
  break_type: beach
  swell_window: [220, 360]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

