# Rosa spot database - Pernambuco (seeded 2026-09-11). The east-facing reef-lined coast (Maracaipe, Porto de Galinhas): SE trade swell, offshore on a W wind.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "Brazil"

region: Pernambuco
defaults: &pe
  timezone: America/Recife
  height_coeff: 1.0
  break_type: beach
  swell_window: [45, 180]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.6, 1.8]

spots:

  # ==== SEEDED 2026-09-11 - pernambuco, 9 spots (primary coastline flow: 2 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 7 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/pernambuco/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: pedra-de-xareu, name: "Pedra de Xaréu", town: "Cabo de Santo Agostinho", lat: -8.3036, lon: -34.9457, offshore_direction: 242, swell_window: [357, 127], offshore_km: 5.0, <<: *pe }  # sat-verified 2026-09-11 (websearch-seeded) normal re-aimed to seaward 62 (GEBCO arc middle)
