# Rosa spot database - South Africa (west and south-west coast). The Atlantic side of the
# Cape (the west coast, the Cape Peninsula) takes Southern Ocean SW groundswell head on and
# is offshore in the summer SE "Cape Doctor"; False Bay and the Overberg / Garden Route face
# south and prefer the winter NW-N. Cold Benguela water. Offshore direction varies per
# coast. Every spot carries offshore_km along its own seaward normal.

defaults: &saw
  timezone: Africa/Johannesburg
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 300]
  ideal:
    wind_dir: [90, 180]
    size_m: [0.8, 2.5]

