# Rosa spot database - Gold Coast (seeded 2026-09-02, with sunshine-coast - south-east Queensland on
# the Sydney/Byron recipe). East-facing Coral Sea coast: S-SE groundswell in winter, E-NE
# cyclone and trade swell in summer, warm water. Offshore wind is from the W/SW. Sand-bottom
# points and beach breaks; break_type per spot. Every spot carries offshore_km along its own
# seaward normal.

country: "Australia"

defaults: &gc
  timezone: Australia/Brisbane
  height_coeff: 1.0
  break_type: beach
  swell_window: [25, 155]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.8, 2.5]

spots:

