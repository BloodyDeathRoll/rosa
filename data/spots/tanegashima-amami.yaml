# Rosa spot database - Tanegashima & Amami (seeded 2026-09-03 - Japan's southern islands, the north half of the arc).
# Tanegashima's east-coast beach breaks, Yakushima, Amami Oshima's reefs. Typhoon swell Jul-Oct from the S-SE and winter monsoon swell from the N-NW; the
# islands catch both, so every spot carries its own swell_window and offshore_direction.
# Reef throughout except the Tanegashima beaches; break_type per spot.

defaults: &tan
  timezone: Asia/Tokyo
  height_coeff: 1.0
  break_type: reef
  swell_window: [90, 220]
  ideal:
    wind_dir: [270, 30]
    size_m: [1.0, 3.0]

spots:

