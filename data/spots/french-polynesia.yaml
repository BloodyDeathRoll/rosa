# Rosa spot database - French Polynesia (seeded 2026-08-31, the first Oceania island region).
# Volcanic islands ringed by barrier reef plus true atolls (Tuamotus): every break is a reef
# pass or reef edge, so `break_type` is reef throughout and deep ocean starts a few hundred
# metres past the reef. Swell is S-SW Southern Ocean groundswell (Apr-Oct season, Teahupoo's
# engine); the north shores (Papenoo, Point Venus, Temae, Avatoru) instead take N Pacific
# winter swell and summer NE trades windswell, so their windows point N-NE. Offshore wind is
# the SE trade blowing off the island; north-facing spots override. Every spot carries
# offshore_km along its own seaward normal, so the sample point follows the pin.

defaults: &pf
  timezone: Pacific/Tahiti
  height_coeff: 1.0
  break_type: reef
  swell_window: [150, 280]
  ideal:
    wind_dir: [20, 140]
    size_m: [0.8, 2.5]

spots:

  # ==== SEEDED 2026-08-31 - french-polynesia, 17 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 17 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/french-polynesia/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: avatoru-pass, name: "Avatoru Pass", town: "Rangiroa", lat: -14.9361, lon: -147.7101, offshore_direction: 202, swell_window: [317, 87], offshore_km: 5.0, <<: *pf }  # sat-verified 2026-08-31 (websearch-seeded)
