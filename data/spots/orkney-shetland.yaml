# Rosa spot database - Orkney and Shetland (seeded 2026-11-12, gap batch 2). Orkney's west coast (Skaill, Birsay, Marwick), Dingieshowe, and Shetland's south end: open North Atlantic swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

region: Orkney and Shetland
country: "United Kingdom"

defaults: &ork
  timezone: Europe/London
  height_coeff: 1.0
  break_type: beach
  swell_window: [175, 305]
  ideal:
    wind_dir: [15, 105]
    size_m: [0.5, 1.8]

