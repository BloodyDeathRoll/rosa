# Rosa spot database - Norway South: south-west Norway: Lista, Jaeren and Stad. North Sea and Norwegian Sea swell from the W-NW; offshore on an E wind.
# Every spot carries offshore_km along its own seaward normal.

country: "Norway"

defaults: &nos
  timezone: Europe/Oslo
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 340]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.8, 2.5]

