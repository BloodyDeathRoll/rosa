# Rosa spot database - Puerto Rico (seeded 2026-11-04). The north-west corner carries the surf:
# Rincon, Aguada, Aguadilla and Isabela on open North Atlantic winter swell (Oct-Apr), then the
# north coast east to San Juan and Luquillo on the same swell and the trade windswell; the
# south-east tip (Punta Tuna) takes Caribbean and tropical swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Puerto Rico"

defaults: &pr
  timezone: America/Puerto_Rico
  height_coeff: 1.0
  break_type: beach
  swell_window: [270, 90]
  ideal:
    wind_dir: [90, 200]
    size_m: [0.8, 2.5]

