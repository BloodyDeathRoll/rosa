# Rosa spot database - Oregon (seeded 2026-08-26, the second US west coast region after
# California). West-facing open-Pacific coast: NW winter groundswell, NW-W summer windswell,
# cold water, strong N winds in summer. Offshore wind is from the east. Every spot carries
# offshore_km along its own seaward normal, so the sample point follows the pin.

defaults: &or
  timezone: America/Los_Angeles
  height_coeff: 1.0
  break_type: beach
  swell_window: [200, 330]
  ideal:
    wind_dir: [50, 130]
    size_m: [0.8, 2.5]

spots:

