# Rosa spot database - England South (seeded 2026-10-09). South Devon east of Bantham, Dorset,
# the Isle of Wight, Hampshire, Sussex and Kent: Atlantic SW swell up the Channel, smaller and
# rarer the further east; offshore on a northerly. Kent's Thanet faces east (North Sea).
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "United Kingdom"

defaults: &ens
  timezone: Europe/London
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 270]
  ideal:
    wind_dir: [300, 60]
    size_m: [0.6, 2.0]

