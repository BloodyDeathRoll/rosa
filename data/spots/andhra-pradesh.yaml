# Rosa spot database - Andhra Pradesh (seeded 2026-10-29). The Bay of Bengal coast round Visakhapatnam
# (Rushikonda, Yarada, Lawsons Bay, Thotlakonda) plus the Godavari and Krishna river bars:
# S-SE groundswell and cyclone swell, offshore in the SW monsoon.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "India"

defaults: &ap
  timezone: Asia/Kolkata
  height_coeff: 1.0
  break_type: beach
  swell_window: [60, 200]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.6, 2.0]

spots:

  # ==== SEEDED 2026-10-29 - andhra-pradesh, 12 spots (primary coastline flow: 0 OSM surf beacons,
  # © OpenStreetMap contributors, ODbL; secondary web-search flow: 12 named breaks, multi-geocoded
  # then read against OSM named beaches). EVERY pin was rendered on ESRI imagery at z16 and
  # judged before entering; moved pins were re-rendered until they sat on the break (judge log in
  # tools/spot-seed/work/andhra-pradesh/judge.json). offshore_direction is the nearest coastline
  # candidate's shore normal; swell_window = seaward +/-65 deg, TODO calibrate; towns from OSM
  # place nodes (tools/spot-seed/towns.py). North to south.
  - { id: chintapalli, name: "Chintapalli", town: "Chintapalli", lat: 18.0730, lon: 83.6580, offshore_direction: 301, swell_window: [56, 186], offshore_km: 5.0, <<: *ap }  # sat-verified 2026-10-29 (websearch-seeded)
