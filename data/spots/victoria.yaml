# Rosa spot database - Victoria (seeded 2026-09-02 - the first south-facing Australian
# region). Bass Strait coast: Southern Ocean SW groundswell year-round, biggest in winter,
# cold water; offshore wind is from the N/NW. Reef points (Bells, Winkipop) and exposed
# beach breaks (Gunnamatta, Woolamai) mixed - break_type per spot. Every spot carries
# offshore_km along its own seaward normal.

country: "Australia"

defaults: &vic
  timezone: Australia/Melbourne
  height_coeff: 1.0
  break_type: reef
  swell_window: [150, 270]
  ideal:
    wind_dir: [300, 60]
    size_m: [1.0, 3.0]

spots:

