# Rosa spot database - El Salvador (worldwide expansion)
#
# One coast only: the Pacific, facing S to SSW along its whole length. Two distinct
# stretches - the cobblestone right-hand points of La Libertad (Punta Roca, El Sunzal,
# El Zonte) and the rivermouth/beach set of the eastern "Wild East" (Las Flores,
# Punta Mango). The coast is close to E-W, so the seaward normal is ~S everywhere and
# the loader's default westward sample push is WRONG here - every spot carries
# offshore_km so the sample follows its own seaward normal.
#
# Swell regime: S-SW groundswell out of the Southern Ocean, boreal-summer peak
# (Apr-Oct), same window as Nicaragua one country south. Offshore wind is the morning
# land breeze (N-NE).
#
# CONFIDENCE: coordinates are coastline-generated + OSM-name confirmed, then
# sat-verified per spot (see per-line tags). Orientations derive from coastline
# geometry, not survey - calibrate before trusting.

defaults: &sv
  timezone: America/El_Salvador
  height_coeff: 1.0
  break_type: beach
  swell_window: [160, 260]     # SSE → WSW Pacific
  ideal:
    wind_dir: [340, 60]        # metadata only (scorer uses offshore_direction)
    size_m: [0.8, 2.5]

spots:
  # Ordered along the coast, west to east (which is also north to south here).
  # offshore_direction = the shore normal of the nearest bathy-passed coastline candidate
  # (tools/spot-seed), swell_window = seaward +/- 65 deg.
  # ---- Far west (Ahuachapan / Sonsonate) ----
  - { id: barra-de-santiago, name: "Barra de Santiago", lat: 13.6887, lon: -90.0063, offshore_direction: 23, swell_window: [138, 268], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15 (barrier-spit beach break at the estuary mouth)
  - { id: los-cobanos,       name: "Los Cóbanos",       lat: 13.5250, lon: -89.8046, offshore_direction: 25, swell_window: [140, 270], offshore_km: 5.0, break_type: reef, <<: *sv }  # sat-verified 2026-08-15 (rock/coral reef, the only one on this coast)
  # ---- La Libertad west (Mizata to El Zonte) ----
  - { id: mizata,            name: "Mizata",            lat: 13.5104, lon: -89.5965, offshore_direction: 2,  swell_window: [117, 247], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (rivermouth cobble point)
  - { id: km-59,             name: "K59",               lat: 13.4990, lon: -89.4740, offshore_direction: 16, swell_window: [131, 261], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (cobble point off the coast road; name is single-source, the pin is imagery)
  - { id: el-zonte,          name: "El Zonte",          lat: 13.4941, lon: -89.4402, offshore_direction: 29, swell_window: [144, 274], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (OSM sport=surfing node; rivermouth cobble right)
  # ---- La Libertad centre (Palmarcito to El Tunco) ----
  - { id: el-palmarcito,     name: "El Palmarcito",     lat: 13.4936, lon: -89.4219, offshore_direction: 29, swell_window: [144, 274], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15 (small cove beside the Rio El Palmarcito mouth)
  - { id: atami,             name: "Atami",             lat: 13.4940, lon: -89.4192, offshore_direction: 20, swell_window: [135, 265], offshore_km: 5.0, break_type: reef, <<: *sv }  # sat-verified 2026-08-15 (reef cove at the beach club; Google's geocode was 800 m inland)
  - { id: el-sunzal,         name: "El Sunzal",         lat: 13.4925, lon: -89.3906, offshore_direction: 35, swell_window: [150, 280], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (long mellow right point, the longboard wave)
  - { id: la-bocana,         name: "La Bocana",         lat: 13.4928, lon: -89.3855, offshore_direction: 29, swell_window: [144, 274], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15 (rivermouth left at El Tunco; OSM node)
  - { id: el-tunco,          name: "El Tunco",          lat: 13.4920, lon: -89.3820, offshore_direction: 39, swell_window: [154, 284], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15
  # ---- La Libertad east (San Blas to Punta Roca) ----
  - { id: san-blas,          name: "San Blas",          lat: 13.4870, lon: -89.3613, offshore_direction: 22, swell_window: [137, 267], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15
  - { id: conchalio,         name: "Conchalío",         lat: 13.4820, lon: -89.3320, offshore_direction: 4,  swell_window: [119, 249], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15
  - { id: punta-roca,        name: "Punta Roca",        lat: 13.4808, lon: -89.3269, offshore_direction: 16, swell_window: [131, 261], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (the country's best wave; long cobble right)
  # ---- Central beaches (La Paz) ----
  - { id: el-pimental,       name: "El Pimental",       lat: 13.3690, lon: -89.0668, offshore_direction: 30, swell_window: [145, 275], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15
  - { id: costa-del-sol,     name: "Costa del Sol",     lat: 13.3297, lon: -88.9762, offshore_direction: 23, swell_window: [138, 268], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15
  # ---- Wild East (Usulutan / San Miguel / La Union) ----
  - { id: el-espino,         name: "El Espino",         lat: 13.1703, lon: -88.2944, offshore_direction: 6,  swell_window: [121, 251], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15
  - { id: punta-mango,       name: "Punta Mango",       lat: 13.1656, lon: -88.1918, offshore_direction: 15, swell_window: [130, 260], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (boat-access cobble right; OSM node + imagery)
  - { id: las-flores,        name: "Las Flores",        lat: 13.1725, lon: -88.1122, offshore_direction: 355, swell_window: [110, 240], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (long sand-bottom right point)
  - { id: el-cuco,           name: "El Cuco",           lat: 13.1722, lon: -88.1046, offshore_direction: 354, swell_window: [109, 239], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15
  - { id: el-esteron,        name: "El Esterón",        lat: 13.1693, lon: -88.0679, offshore_direction: 15, swell_window: [130, 260], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15
