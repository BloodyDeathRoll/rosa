  - { id: el-sunzal,         name: "El Sunzal", town: "El Sunzal",         lat: 13.4925, lon: -89.3906, offshore_direction: 35, swell_window: [150, 280], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (long mellow right point, the longboard wave)
