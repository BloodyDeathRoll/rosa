# Rosa spot database - El Salvador (worldwide expansion)
#
# One coast only: the Pacific, facing S to SSW along its whole length. Two distinct
# stretches - the cobblestone right-hand points of La Libertad (Punta Roca, El Sunzal,
# El Zonte) and the rivermouth/beach set of the eastern "Wild East" (Las Flores,
# Punta Mango). The coast is close to E-W, so the seaward normal is ~S everywhere and
# the loader's default westward sample push is WRONG here - every spot carries
# offshore_km so the sample follows its own seaward normal.
#
# Swell regime: S-SW groundswell out of the Southern Ocean, boreal-summer peak
# (Apr-Oct), same window as Nicaragua one country south. Offshore wind is the morning
# land breeze (N-NE).
#
# CONFIDENCE: coordinates are coastline-generated + OSM-name confirmed, then
# sat-verified per spot (see per-line tags). Orientations derive from coastline
# geometry, not survey - calibrate before trusting.

country: "El Salvador"

defaults: &sv
  timezone: America/El_Salvador
  height_coeff: 1.0
  break_type: beach
  swell_window: [160, 260]     # SSE → WSW Pacific
  ideal:
    wind_dir: [340, 60]        # metadata only (scorer uses offshore_direction)
    size_m: [0.8, 2.5]

spots:
  # Ordered along the coast, west to east (which is also north to south here).
  # offshore_direction = the shore normal of the nearest bathy-passed coastline candidate
  # (tools/spot-seed), swell_window = seaward +/- 65 deg.
  # ---- Far west (Ahuachapan / Sonsonate) ----
  - { id: barra-de-santiago, name: "Barra de Santiago", town: "Barra de Santiago", lat: 13.6887, lon: -90.0063, offshore_direction: 23, swell_window: [138, 268], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15 (barrier-spit beach break at the estuary mouth)
  - { id: los-cobanos,       name: "Los Cóbanos", town: "Los Cóbanos",       lat: 13.5250, lon: -89.8046, offshore_direction: 25, swell_window: [140, 270], offshore_km: 5.0, break_type: reef, <<: *sv }  # sat-verified 2026-08-15 (rock/coral reef, the only one on this coast)
  # ---- La Libertad west (Mizata to El Zonte) ----
  - { id: mizata,            name: "Mizata", town: "Mizata",            lat: 13.5104, lon: -89.5965, offshore_direction: 2,  swell_window: [117, 247], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (rivermouth cobble point)
  - { id: km-61,             name: "K61", town: "Teotepeque",               lat: 13.4986, lon: -89.4770, offshore_direction: 16, swell_window: [131, 261], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-16 (mellow point 300 m west of K59)
  - { id: km-59,             name: "K59", town: "Teotepeque",               lat: 13.4990, lon: -89.4740, offshore_direction: 16, swell_window: [131, 261], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (cobble point off the coast road; name is single-source, the pin is imagery)
  - { id: el-zonte,          name: "El Zonte", town: "El Zonte",          lat: 13.4941, lon: -89.4402, offshore_direction: 29, swell_window: [144, 274], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (OSM sport=surfing node; rivermouth cobble right)
  # ---- La Libertad centre (Palmarcito to El Tunco) ----
  - { id: el-palmarcito,     name: "El Palmarcito", town: "El Palmarcito",     lat: 13.4936, lon: -89.4219, offshore_direction: 29, swell_window: [144, 274], offshore_km: 5.0, <<: *sv }  # sat-verified 2026-08-15 (small cove beside the Rio El Palmarcito mouth)
