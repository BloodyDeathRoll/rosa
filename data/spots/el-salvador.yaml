  - { id: las-flores,        name: "Las Flores", town: "El Cuco",        lat: 13.1725, lon: -88.1122, offshore_direction: 355, swell_window: [110, 240], offshore_km: 5.0, break_type: point, <<: *sv }  # sat-verified 2026-08-15 (long sand-bottom right point)
