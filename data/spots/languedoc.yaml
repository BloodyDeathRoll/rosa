# Rosa spot database - Languedoc (seeded 2026-11-12). Sete, Palavas and Carnon on the Gulf of Lion:
# short-period SE-E marin wind swell, cleaned up by the offshore tramontane and mistral.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "France"

defaults: &lng
  timezone: Europe/Paris
  height_coeff: 1.0
  break_type: beach
  swell_window: [95, 225]
  ideal:
    wind_dir: [295, 25]
    size_m: [0.5, 1.5]

