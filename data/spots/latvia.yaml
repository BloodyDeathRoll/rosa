# Rosa spot database - Latvia (seeded 2026-11-12, gap batch). Pavilosta and Liepaja: Baltic wind swell from W-NW storms.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Latvia"

defaults: &lv
  timezone: Europe/Riga
  height_coeff: 1.0
  break_type: beach
  swell_window: [242, 12]
  ideal:
    wind_dir: [82, 172]
    size_m: [0.5, 1.8]

spots:

  # ==== SEEDED 2026-11-12 - gap batch, 2 spots (web flow: names from tourism boards, councils,
  # news and prose guides, never competitor listings; pins on named OSM features (© OpenStreetMap
  # contributors, ODbL) or Nominatim / Photon, every pin rendered and judged at z16, re-read by the
  # coordinator on contact sheets; tools/spot-seed/work/gap-europe/). North to south.
  - { id: pavilosta, name: "Pāvilosta", town: "Pāvilosta", lat: 56.8917, lon: 21.1748, offshore_direction: 150, swell_window: [265, 35], offshore_km: 5.0, break_type: beach, <<: *lv }  # sat-verified 2026-11-12 (websearch-seeded, conf 0.7)
  - { id: liepaja-north-pier, name: "Liepāja North Pier", town: "Liepāja", lat: 56.5580, lon: 20.9995, offshore_direction: 105, swell_window: [220, 350], offshore_km: 5.0, break_type: beach, <<: *lv }  # sat-verified 2026-11-12 (websearch-seeded, conf 0.65)
