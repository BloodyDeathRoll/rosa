# Rosa spot database - Normandy (seeded 2026-10-09). The Cotentin's west coast takes Atlantic
# W-NW swell up the Channel; the Calvados and Seine-Maritime shores face north and need a
# Channel W-NW or a North Sea windswell. Big tides: most breaks are tide-specific.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

country: "France"

defaults: &nor
  timezone: Europe/Paris
  height_coeff: 1.0
  break_type: beach
  swell_window: [220, 340]
  ideal:
    wind_dir: [30, 160]
    size_m: [0.6, 2.0]

