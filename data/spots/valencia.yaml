# Rosa spot database - Valencia. The Valencian Community's coast: Castellon (Benicassim,
# Irta), Valencia city and the Safor (Malva-rosa, Cullera, Oliva), and Alicante's Marina
# Alta and Baixa (Javea, Calp, Benidorm), Alicante city and the Vega Baja (Guardamar,
# Torrevieja). An E-facing western Mediterranean coast on short-period NE-SE Levante wind
# swell, offshore on the W poniente. Every spot carries offshore_km along its own seaward
# normal; break_type per spot.

country: "Spain"

defaults: &vlc
  timezone: Europe/Madrid
  height_coeff: 1.0
  break_type: beach
  swell_window: [0, 180]
  ideal:
    wind_dir: [225, 315]
    size_m: [0.5, 1.5]

