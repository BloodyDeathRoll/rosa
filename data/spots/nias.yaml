  # coordinator on contact sheets; tools/spot-seed/work/cand2-sumatra/). North to south.
  - { id: the-machine, name: "The Machine", town: "Lagundri", lat: 0.5698, lon: 97.7441, offshore_direction: 70, swell_window: [185, 315], offshore_km: 5.0, break_type: reef, <<: *nia }  # sat-verified 2026-11-19 (websearch-seeded, conf 0.65)
