# Rosa spot database - Colombia Caribbean (seeded 2026-10-09). Cartagena, Galerazamba, Puerto Colombia, Santa Marta, Tayrona,
# Palomino and the Guajira. NE trade windswell most of the year, N swell Nov-Mar.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

region: Colombia Caribbean
country: "Colombia"

defaults: &cc
  timezone: America/Bogota
  height_coeff: 1.0
  break_type: beach
  swell_window: [315, 90]
  ideal:
    wind_dir: [135, 225]
    size_m: [0.8, 2.5]

spots:

