# Rosa spot database - Liguria (seeded 2026-11-04). The Ligurian Sea's north shore, Sanremo to
# Lerici: south-facing coves and reefs on short-period libeccio (SW) and scirocco (SE) wind swell,
# best Oct-Apr; the mountains behind give clean north offshores (tramontana).
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Italy"

defaults: &lig
  timezone: Europe/Rome
  height_coeff: 1.0
  break_type: beach
  swell_window: [150, 260]
  ideal:
    wind_dir: [315, 45]
    size_m: [0.6, 1.5]

