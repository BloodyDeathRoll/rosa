# Rosa spot database - Campania (seeded 2026-11-04). The southern Tyrrhenian coast, Mondragone to Palinuro: the
# Phlegraean beaches, Ischia, Salerno and the Cilento on libeccio (SW) and mistral (W-NW) wind swell,
# short period, best Oct-Apr; offshore is NE-E.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Italy"

defaults: &cmp
  timezone: Europe/Rome
  height_coeff: 1.0
  break_type: beach
  swell_window: [170, 300]
  ideal:
    wind_dir: [20, 110]
    size_m: [0.6, 1.5]

