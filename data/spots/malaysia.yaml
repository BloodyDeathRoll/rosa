# Rosa spot database - Malaysia (seeded 2026-11-04). The east coast of the peninsula, Terengganu to
# Johor plus Tioman: NE monsoon wind swell from the South China Sea, Nov-Mar only - flat the rest of
# the year. Short period; onshore NE wind most days, glassy early mornings.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Malaysia"

defaults: &my
  timezone: Asia/Kuala_Lumpur
  height_coeff: 1.0
  break_type: beach
  swell_window: [0, 140]
  ideal:
    wind_dir: [200, 290]
    size_m: [0.5, 1.5]

