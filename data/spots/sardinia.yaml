# Rosa spot database - Sardinia (seeded 2026-11-04). The west coast (Porto Ferro, Capo Mannu, Buggerru)
# takes the full fetch of the mistral (NW) from the Gulf of Lion - the most consistent surf in Italy;
# the north (Rena Majore) the same swell wrapping, the south (Chia, Poetto, Solanas) S-SE scirocco
# swell. Short-to-mid period, best Oct-Apr. Offshore direction varies per coast.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Italy"

defaults: &srd
  timezone: Europe/Rome
  height_coeff: 1.0
  break_type: beach
  swell_window: [200, 360]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.6, 1.5]

