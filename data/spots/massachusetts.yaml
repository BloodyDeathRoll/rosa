# Rosa spot database - Massachusetts (seeded 2026-10-09). Horseneck on the south coast, the
# south shores of Martha's Vineyard and Nantucket, the outer Cape from Chatham to Provincetown,
# the South Shore and the North Shore to Salisbury: cold water, mostly autumn hurricane swell
# and winter nor'easters. Facing changes all the way round, so every spot carries its own
# offshore_direction and swell_window; break_type per spot.

defaults: &ma
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [30, 200]
  ideal:
    wind_dir: [230, 330]
    size_m: [0.6, 2.5]

spots:

