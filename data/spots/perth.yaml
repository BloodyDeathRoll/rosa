# Rosa spot database - Perth (seeded 2026-09-02, with margaret-river - the first West Australian
# regions). West-facing Indian Ocean coast: SW groundswell year-round, biggest in winter, and
# the afternoon sea breeze ("the Fremantle Doctor") blows onshore from the SW most summer days.
# Offshore wind is from the east. Every spot carries offshore_km along its own seaward normal.

country: "Australia"

defaults: &per
  timezone: Australia/Perth
  height_coeff: 1.0
  break_type: beach
  swell_window: [180, 300]
  ideal:
    wind_dir: [45, 135]
    size_m: [0.6, 2.0]

spots:

