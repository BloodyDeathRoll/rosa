# Rosa spot database - Delmarva (seeded 2026-11-12). Delaware's beaches from Cape Henlopen to Fenwick Island and
# Ocean City Inlet in Maryland: short-period Atlantic beach breaks off sandbars and jetties, best on SE swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "United States"

defaults: &dmv
  timezone: America/New_York
  height_coeff: 1.0
  break_type: beach
  swell_window: [32, 162]
  ideal:
    wind_dir: [232, 322]
    size_m: [0.6, 2.0]

