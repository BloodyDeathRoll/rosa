# Rosa spot database - Israel (seed region)
# Coordinates sourced from OpenStreetMap beach features (© OpenStreetMap contributors, ODbL)
# where matched - tagged "OSM". Unmatched spots remain approximate - tagged "TODO verify".
# offshore_direction: compass direction the OFFSHORE WIND blows FROM. Derived per spot
#   from the local coastline tangent (see spots.py); override inline where local
#   knowledge differs (e.g. Haifa Bay, coves). Israel's near-straight W-facing coast → ~90-120.
# offshore_point: NOT stored - derived from each spot's own pin. Default pushes ~0.06 deg W
#   (seaward on this coast); set `offshore_km` (+ `offshore_bearing`, default = seaward
#   normal) to cast the ray elsewhere. A pin is the ONLY place a location is written down.
# swell_window: swell source directions that reach the break.

defaults: &il
  timezone: Asia/Jerusalem
  swell_window: [250, 340]
  height_coeff: 1.0        # calibrate per spot
  break_type: beach
  ideal:
    wind_dir: [45, 135]
    size_m: [0.6, 1.5]


