# Rosa spot database — Israel (seed region)
# NOTE: coordinates are approximate seeds — verify each in the field / satellite before launch (TODO tags).
# offshore_direction convention: compass direction the OFFSHORE WIND blows FROM (Israel coast faces W → E wind = offshore → 90).
# offshore_point: shared deep-water extraction point per coast segment.
# swell_window: swell source directions that reach the break.

defaults: &il
  timezone: Asia/Jerusalem
  offshore_direction: 90
  swell_window: [250, 340]
  height_coeff: 1.0        # calibrate per spot
  break_type: beach
  ideal:
    wind_dir: [45, 135]
    size_m: [0.6, 1.5]

offshore_points:
  il_south: [31.9, 34.35]   # off Ashdod/Ashkelon
  il_central: [32.2, 34.55] # off Tel Aviv–Netanya
  il_north: [32.9, 34.85]   # off Haifa–Achziv

spots:
