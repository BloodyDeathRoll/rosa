# Rosa spot database - Morocco (seeded 2026-08-27). The Atlantic coast from Cap Spartel
# to Dakhla: North Atlantic NW groundswell in winter, a long right-point coast around
# Taghazout, beachbreak north of Agadir. Offshore wind is the easterly off the land
# (the chergui). Every spot carries offshore_km along its own seaward normal, so the
# sample point follows the pin. The Mediterranean coast is out of scope (see the
# seed.py bbox comment).

country: "Morocco"

defaults: &ma
  timezone: Africa/Casablanca
  height_coeff: 1.0
  break_type: beach
  swell_window: [230, 350]
  ideal:
    wind_dir: [50, 130]
    size_m: [0.8, 3.0]

