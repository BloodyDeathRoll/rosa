# Rosa spot database - Coromandel (seeded 2026-11-12).
# the peninsula's east coast beaches and reefs from New Chums to Whangamata and Waihi Beach.
# NE-E Pacific swell and summer cyclone swell; offshore in the prevailing westerly.
