# Rosa spot database - Canada (seeded 2026-11-12, gap batch). St. Vincent's on the Avalon's south shore: steep beach open to North Atlantic swell.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.
# Defaults are TODO calibrate.

country: "Canada"

defaults: &nl
  timezone: America/St_Johns
  height_coeff: 1.0
  break_type: beach
  swell_window: [163, 293]
  ideal:
    wind_dir: [3, 93]
    size_m: [0.5, 1.8]

spots:

