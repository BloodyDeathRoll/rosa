  # coordinator on contact sheets; tools/spot-seed/work/gap-americas/). North to south.
  - { id: st-vincents-beach, name: "St. Vincent's Beach", town: "St. Vincent's", lat: 46.7891, lon: -53.6374, offshore_direction: 48, swell_window: [163, 293], offshore_km: 5.0, break_type: beach, <<: *nl }  # sat-verified 2026-11-12 (websearch-seeded, conf 0.65)
