# Rosa spot database - Cornwall & Devon (seeded 2026-09-03). Atlantic W-NW groundswell, biggest Sep-Mar; the north coast faces NW and is offshore on an E-SE wind, the south coast the reverse.
# Every spot carries offshore_km along its own seaward normal; break_type per spot.

defaults: &cd
  timezone: Europe/London
  height_coeff: 1.0
  break_type: beach
  swell_window: [230, 340]
  ideal:
    wind_dir: [60, 160]
    size_m: [0.8, 2.5]

spots:

