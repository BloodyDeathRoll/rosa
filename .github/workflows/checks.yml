# PR checks (audit 2026-09-11, proposals item 4): what was run by hand before a merge.
# CI only - nothing here schedules or deploys; the forecast cycle stays on the Oracle VM.
# Actions are pinned by commit SHA; Dependabot (.github/dependabot.yml) proposes bumps.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked pytest -q
        env:
          PYTHONPATH: src

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # sync-data copies ../data/out, a gitignored VM build artifact - an empty index stands in
      - run: mkdir -p ../data/out && echo '{"spots":{}}' > ../data/out/index.json
      - run: npm test # vitest: swim derivations + the surf-mode byte-for-byte snapshot
      - run: npm run build # tsc --noEmit + vite build

  user-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/user-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # the tests import .ts via Node's type stripping (>= 22.18)
          cache: npm
          cache-dependency-path: deploy/user-api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  push-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/push-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/push-api/package-lock.json
      - run: npm ci
      - name: every route module loads
        run: for f in api/*.js; do node -e "import('./$f').catch((e) => { console.error('$f', e); process.exit(1); })"; done
      - run: npm test --if-present
