name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        env:
          # The code-review plugin backgrounds its sub-agents and the headless run exits before
          # they report ("waiting for the eligibility check"), passing green with no review.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses bot-opened PRs by default; Dependabot's get reviewed too. Only
          # Dependabot - '*' would let any GitHub App trigger a review. Its runs read the
          # Dependabot copy of CLAUDE_CODE_OAUTH_TOKEN (GitHub hides Actions secrets from them).
          allowed_bots: 'dependabot'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # The plugin skips automated PRs by design, so Dependabot bumps get a direct prompt.
          prompt: >-
            ${{ github.event.pull_request.user.login == 'dependabot[bot]'
            && format('Review dependency-bump PR {0}/pull/{1}. Read the diff (gh pr diff), then check each bumped package for breaking or behaviour changes (release notes, changelogs) that affect how this repo uses it (grep the code). Post each real problem as an inline comment, then post one summary PR comment (gh pr comment) that lists every bump with a verdict and ends with "No issues found" if there are none.', github.repository, github.event.pull_request.number)
            || format('/code-review:code-review --comment {0}/pull/{1}', github.repository, github.event.pull_request.number) }}
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),WebFetch,Grep,Read"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

