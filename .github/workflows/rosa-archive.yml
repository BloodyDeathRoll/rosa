name: Rosa archive cron

# Accumulates the Stage-0 forecast lead-time archive (accuracy roadmap Stage 0) *now*, without
# waiting on the Oracle ARM VM. Runs `rosa-pipeline archive` 4x/day and persists the growing
# append-only JSONL to a dedicated orphan `data` branch — `main` stays code-only (data/verify is
# gitignored there). The clock can't be back-filled, so this starts the archive today.
#
# Zero secrets: Open-Meteo + NDBC are keyless; the push uses the built-in GITHUB_TOKEN.
# When the Oracle box lands, its persistent disk becomes the archive home and this can be paused
# (disable the schedule) — the data branch is a portable seed you can scp onto the VM.

on:
  schedule:
    - cron: "0 5,11,17,23 * * *"   # 05/11/17/23 UTC — mirrors deploy/oracle/rosa-cycle.timer
  workflow_dispatch: {}            # manual "Run workflow" button

permissions:
  contents: write                  # push the archive to the data branch

concurrency:
  group: rosa-archive              # never let two cycles race on the push
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      GIT_AUTHOR_NAME: rosa-bot
      GIT_AUTHOR_EMAIL: rosa-bot@users.noreply.github.com
      GIT_COMMITTER_NAME: rosa-bot
      GIT_COMMITTER_EMAIL: rosa-bot@users.noreply.github.com
    steps:
      - name: Checkout pipeline code (main)
        uses: actions/checkout@v5

      - name: Check out (or bootstrap) the data branch -> ./_archive
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "$DATA_REMOTE" data >/dev/null 2>&1; then
            git clone --depth=1 --branch data "$DATA_REMOTE" _archive
          else
            echo "no data branch yet — creating an empty orphan"
            git clone --depth=1 "$DATA_REMOTE" _archive
            cd _archive
            git checkout --orphan data
            git rm -rfq . || true
            mkdir -p archive
            {
              echo "# Rosa forecast lead-time archive (Stage 0)"
              echo
              echo "One append-only JSONL per buoy under \`archive/\`; rows are"
              echo "\`{run, valid, hs, tp, dir}\`. Written by .github/workflows/rosa-archive.yml."
              echo "Score it with: rosa-pipeline verify --buoy <id> --archive --archive-dir <this>/archive"
            } > README.md
            git add -A
            git commit -m "chore: initialise archive data branch"
            git push origin data
          fi

      - name: Install uv
        # Official installer instead of astral-sh/setup-uv: that action still bundles the
        # deprecated Node 20 runtime; a plain script has no JS runtime, so no deprecation.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync pipeline deps
        run: uv sync --project pipeline

      - name: Append current forecast at every buoy
        run: uv run --project pipeline rosa-pipeline archive --archive-dir _archive/archive

      - name: Commit + push the updated archive
        run: |
          set -euo pipefail
          cd _archive
          git add -A
          if git diff --cached --quiet; then
            echo "no new archive rows this cycle — nothing to commit"
            exit 0
          fi
          git commit -m "data: archive $(date -u +%FT%TZ)"
          git push origin HEAD:data
