<!doctype html>
<!-- Satellite verification tile viewer. Renders ESRI World Imagery centered on
     ?lat=&lon=&z= with a fixed red crosshair at the exact center coordinate, so a
     screenshot shows precisely where a candidate spot coordinate lands.
     ESRI World Imagery is used here for build-time visual verification only
     (like manually eyeballing a satellite map) — NOT redistributed. -->
<html>
  <head>
    <meta charset="utf8" />
    <style>
      html, body, #m { margin: 0; height: 100%; width: 100%; }
      .xh { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px;
            transform: translate(-20px, -20px); z-index: 9; pointer-events: none; }
      .xh:before, .xh:after { content: ""; position: absolute; background: #ff2d2d;
            box-shadow: 0 0 2px #000; }
      .xh:before { left: 19px; top: 0; width: 2px; height: 40px; }
      .xh:after { top: 19px; left: 0; height: 2px; width: 40px; }
      #lbl { position: absolute; left: 8px; top: 8px; z-index: 9; background: #000a;
             color: #fff; font: 13px monospace; padding: 4px 8px; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="m"></div>
    <div class="xh"></div>
    <div id="lbl"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const p = new URLSearchParams(location.search);
      const lat = +p.get("lat"), lon = +p.get("lon"), z = +(p.get("z") || 16);
      document.getElementById("lbl").textContent =
        (p.get("name") || "") + "  " + lat.toFixed(4) + ", " + lon.toFixed(4);
      const m = L.map("m", { zoomControl: false, attributionControl: false }).setView([lat, lon], z);
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 19 }
      ).addTo(m);
      window.__ready = false;
      m.whenReady(() => setTimeout(() => (window.__ready = true), 2500));
    </script>
  </body>
</html>
