[project]
name = "rosa-pipeline"
version = "0.1.0"
description = "Rosa forecast pipeline: fetch -> extract -> transform -> score -> publish"
requires-python = ">=3.11"
dependencies = [
    "astral>=3.2",
    "httpx>=0.27",
    "pygrib>=2.1",
    "pyyaml>=6.0",
]

[project.scripts]
rosa-pipeline = "rosa_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosa_pipeline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
